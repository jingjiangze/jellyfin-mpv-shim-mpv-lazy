":"S","name":"舞台剧「千与千寻」飞往伦敦","year":"2024","rating":null,"poster":"","pf":"","episodes":0,"overview":"2024 年春，戏剧圣地伦敦西区刻下了新的历史。舞台剧《千与千寻的神隐》接受了热烈的邀请，登陆伦敦。由日本演员主演的日语演出极为罕见。此外，还挑战了戏剧界壮举——在 4 个月内演出 135 场。然而，困难重重。英国和日本工作人员之间产生的语言障碍和工作方式的不同。熟悉的木偶和小道具也焕然一新，演员感到困惑。然后，逐渐落后的排练。精神和肉体上都感到被逼到绝境。在异国他乡的新挑战。追踪其幕后故事的纪录片。"},{"id":"fe08b42939e9da5ba5f8035e05b31936","kind":"lib","type":"S","name":"无职转生～到了异世界就拿出真本事～","year":"2021","rating":8.4,"poster":"","pf":"","episodes":1,"overview":"posters/e2cba8a9ed.jpg"},{"id":"45de126e628b925601473d87a408a35b","kind":"lib","type":"M","name":"希望囚徒","year":"2026","rating":6.5,"poster":"","pf":"","episodes":0,"overview":"posters/d6295930f5.jpg"},{"id":"fb3b412b8e25d88bf64ef4a2d5f0d4d2","kind":"lib","type":"S","name":"響け！ユーフォニアム３","year":null,"rating":null,"poster":"","pf":"","episodes":1,"overview":"posters/2fe7ec3054.jpg"},{"id":"d5b1b9c2c88070b060d64a83516a3816","kind":"lib","type":"S","name":"新劇場版 銀魂 -吉原大炎上-","year":null,"rating":null,"poster":"","pf":"","episodes":3,"overview":"posters/5fa4b28e60.jpg"},{"id":"9cbd05f313ada0fe92a09371ee35c111","kind":"lib","type":"S","name":"星际牛仔","year":"1998","rating":8.5,"poster":"","pf":"","episodes":3,"overview":"2071年，随着超光速航行技术的实现，人类得以在太阳系范围内方便的移动，但是由于设计上的失误，这种技术引发了月球的爆炸，无数的月球碎片被吸引向地球，造成了空前绝后的大灾难。存活下来的人类逃离地球，并开始在太阳系各地建立家园。由于这次灾难，国家政府等权利机构都极为不稳定、治安问题也成为了一个难题。有些组织开始允许个人抓捕通缉的罪犯并换取奖金，这就是“赏金猎人”。史派克和杰特是驾驶飞船BEBOP号在宇宙中以捉拿逃犯获取奖金为生的赏金猎人。两人在星际间的旅程中，结识了身负巨债、嗜财如命的美女菲和电脑神童艾德，并收养了拥有高智商的数据狗爱因。从此，四人一狗游荡在广阔之宇宙之中，在自己与他人的生活中经历著种种悲欢离合，也寻找著各自的过去。"},{"id":"697010c57a87ce3adaa0b9fd9cf101df","kind":"lib","type":"S","name":"异国日记","year":"2026","rating":8.6,"poster":"","pf":"","episodes":0,"overview":"怕生的小说家·高代槙生，因一时冲动，收养了在姐姐夫妇葬礼上失去双亲的侄女田汲朝。意料之外开始的同居生活，让槙生原本寂静的日常骤变。因不惯与人同住的性情，他对如何与十五岁的朝相处感到深深不安。另一边，失去双亲、无处可归的朝，在初次体会的孤独中，渐渐触碰到与母亲截然不同的、“不像大人”的槙生的生活方式。不擅交际、偏爱孤独的槙生，与天性烂漫率真的朝。性格与价值观都截然不同的两人，带着困惑，开始了磕磕绊绊的共同生活。这是两个孤独者，小心翼翼、摸索前行的年龄差同居物语。"},{"id":"dca8701fe39889534f05deb709552d2f","kind":"lib","type":"S","name":"银河英雄传说","year":"1988","rating":8.6,"poster":"","pf":"","episodes":2,"overview":"故事发生在遥远未来的浩瀚宇宙中，银河帝国与从帝国中分裂开来的自由行星同盟是存在于其中的两大势力，他们相互为敌，之间不断发生着残酷的战争。联结着帝国和同盟的，是两条著名的回廊——“费沙回廊”和“伊谢尔伦回廊”，而在费沙回廊中，存在这一个特殊的国家——“费沙自治领”，这个看似弱小的国家以它的方式在动荡的局势中独善其身，成为了不可小觑的又一股势力。长久以来，在三股势力之间维持着微妙的平衡，而帝国的莱因哈特·冯·罗严克拉姆（堀川亮 配音）与同盟的杨威利（富山敬 配音）的出现预示着平衡的终结，历史的车轮就此开始转动。"},{"id":"ba65d644ad471e199dd8c05cbf9adb97","kind":"lib","type":"S","name":"银魂","year":"2006","rating":8.2,"poster":"","pf":"","episodes":4,"overview":"江户时代末期（本作的 20 年前）, 被称为“天人（あまんと）”的谜之异星人来袭。于是地球人与天人之间的战争瞬即爆发，为数众多的武士和攘夷派志士都参与与天人的战斗，幕府见识到天人强大的实力后，最终向天人低头，放弃武士不管，擅自与天人签订不平等条约，准许他们入国。其后更颁布了“废刀令”，夺走了武士的刀，使他们无力反抗。自此，天人横行霸道，幕府为天人所影响，甚至被控制，成为了“傀儡政权”。在这样的时代，有一个武士与同伴愉快地过著异想天开的生活。"},{"id":"c1da0e8838931ae2fe21a8546b5aea73","kind":"lib","type":"S","name":"銀魂  銀ノ魂篇","year":null,"rating":null,"poster":"","pf":"","episodes":2,"overview":"posters/079414c658.jpg"},{"id":"30dde3e3c528069795f0480501db1bd0","kind":"lib","type":"S","name":"銀魂  銀ノ魂篇2","year":null,"rating":null,"poster":"","pf":"","episodes":2,"overview":"posters/d4a13adc98.jpg"},{"id":"f99d02dca2230b4ee3a6613e16557b39","kind":"lib","type":"S","name":"銀魂’延長戦","year":null,"rating":null,"poster":"","pf":"","episodes":2,"overview":"posters/3535e8eb44.jpg"},{"id":"500a39dd193784ff114b9b4c53abbfaf","kind":"lib","type":"S","name":"章鱼哔的原罪","year":"2025","rating":8.8,"poster":"","pf":"","episodes":1,"overview":"“章鱼哔的原罪”是一个关于“为了在宇宙中传播快乐而旅行的快乐星球人”，与不会笑的少女静香在地球上相遇的故事。被静香命名为“章鱼噼”的快乐星球人，试图用拥有神奇力量的“快乐道具”让静香露出笑容，但却屡屡失败。就在这时，满身伤痕的静香向章鱼哔求助，章鱼哔违反了规定，将快乐道具借给了她，从而引发了一系列严重的问题……"},{"id":"665df7ec490f01862974237e9965b05c","kind":"lib","type":"S","name":"昭和元禄落语心中","year":"2016","rating":8.0,"poster":"","pf":"","episodes":2,"overview":"因无法忘记在刑务所的落语慰问会中见到的大名人八云的《死神》落语段子，出狱的与太郎径直前往寄席，拜倒在八云面前。成为八云住所雇工以及弟子的与太郎，却发现在八云之处住着一位名叫小夏的女性，八云与小夏似乎有着他人无从触及的因缘。"},{"id":"4f2705626a7c902961d43c9e53d05b15","kind":"lib","type":"M","name":"指环王2：双塔奇兵","year":null,"rating":null,"poster":"","pf":"","episodes":0,"overview":"posters/27f49cc114.jpg"},{"id":"8552a0085fbd
