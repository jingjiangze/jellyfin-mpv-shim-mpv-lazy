<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0f">
<title>番组计划 · 新番与新片</title>
<style>/* 站点共用样式：首页（新番/新片/番剧表）与媒体库页共用一套 token 与组件 */
:root {
  --bg: #0b0b0f;
  --bg2: #14141b;
  --card: #181820;
  --card2: #22222c;
  --line: #2a2a36;
  --fg: #ececf1;
  --dim: #8a8a96;
  --accent: #f09199;
  --accent-dim: #b8656c;
  --star: #f5c451;
  --r: 12px;
  --r-sm: 8px;
  --shadow: 0 18px 48px rgba(0, 0, 0, .55);
  --header-h: 58px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
body {
  font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { display: block; }

/* ---------- 顶栏 ---------- */
.top {
  position: fixed; inset: 0 0 auto 0; height: var(--header-h); z-index: 50;
  background: linear-gradient(180deg, rgba(11, 11, 15, .96), rgba(11, 11, 15, .72) 70%, transparent);
  transition: background .25s, backdrop-filter .25s;
}
.top.solid { background: rgba(11, 11, 15, .97); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.tw {
  max-width: 1520px; height: 100%; margin: 0 auto; padding: 0 34px;
  display: flex; align-items: center; gap: 26px;
}
.logo { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
.logo i { width: 10px; height: 18px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 12px rgba(240, 145, 153, .5); }
.logo b { color: var(--accent); }
.nav { display: flex; gap: 4px; }
.nav a {
  padding: 7px 15px; border-radius: 999px; font-size: 14.5px; color: var(--dim);
  cursor: pointer; transition: color .18s, background .18s; white-space: nowrap;
}
.nav a:hover { color: var(--fg); }
.nav a.on { color: var(--bg); background: var(--accent); font-weight: 600; }
.searchbox { margin-left: auto; position: relative; }
.searchbox input {
  width: 210px; padding: 8px 13px; border-radius: 999px; font-size: 13.5px;
  color: var(--fg); background: var(--card2); border: 1px solid transparent; outline: none;
  transition: border-color .2s, width .2s;
}
.searchbox input:focus { border-color: var(--accent-dim); width: 250px; }
.cnt { font-size: 12.5px; color: var(--dim); white-space: nowrap; }

/* ---------- 布局 ---------- */
main { max-width: 1520px; margin: 0 auto; padding: calc(var(--header-h) + 18px) 34px 70px; }
.block { margin: 34px 0 0; }
.bhead { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; }
.bhead h2 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: .3px; }
.bhead span { font-size: 12.5px; color: var(--dim); }

/* ---------- 首页 hero ---------- */
.hero {
  position: relative; border-radius: 18px; overflow: hidden; margin-top: 6px;
  min-height: 400px; display: flex; align-items: flex-end;
  background: var(--bg2); isolation: isolate;
}
.hero-bg {
  position: absolute; inset: 0; z-index: -2;
  background-size: cover; background-position: center 30%; transform: scale(1.02);
  filter: saturate(1.05);
}
.hero::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(90deg, rgba(11, 11, 15, .96) 8%, rgba(11, 11, 15, .72) 42%, rgba(11, 11, 15, .2) 72%, rgba(11, 11, 15, .6)),
              linear-gradient(0deg, var(--bg) 2%, transparent 46%);
}
.hero-info { padding: 40px 44px; max-width: 640px; }
.hero-tag { font-size: 12px; letter-spacing: 2px; color: var(--accent); font-weight: 600; margin-bottom: 12px; }
.hero h1 { margin: 0 0 12px; font-size: 40px; line-height: 1.16; font-weight: 720; letter-spacing: -.5px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13.5px; color: var(--dim); margin-bottom: 14px; }
.hero-meta b { color: var(--star); font-weight: 600; }
.hero p { margin: 0 0 22px; font-size: 14.5px; line-height: 1.75; color: #c8c8d2; }
.hero-btns { display: flex; gap: 12px; flex-wrap: wrap; }
.hbtn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 999px;
  font-size: 14.5px; font-weight: 600; cursor: pointer; border: 1px solid transparent;
  transition: transform .16s, background .18s, border-color .18s;
}
.hbtn:hover { transform: translateY(-1px); }
.hbtn.primary { background: var(--accent); color: #17171d; }
.hbtn.ghost { background: rgba(255, 255, 255, .1); color: var(--fg); border-color: rgba(255, 255, 255, .18); }
.hbtn.ghost:hover { background: rgba(255, 255, 255, .17); }

/* ---------- 横滑轨道 ---------- */
.row {
  display: grid; grid-auto-flow: column; grid-auto-columns: 168px; gap: 14px;
  overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity;
  scrollbar-width: none;
}
.row::-webkit-scrollbar { display: none; }
.row .card { scroll-snap-align: start; }

/* ---------- 网格 ---------- */
.grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
}

/* ---------- 卡片 ---------- */
.card { cursor: pointer; position: relative; }
.pw {
  position: relative; aspect-ratio: 2 / 3; border-radius: var(--r); overflow: hidden;
  background: var(--card); border: 1px solid rgba(255, 255, 255, .04);
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
}
.card:hover .pw { transform: translateY(-4px); box-shadow: var(--shadow); border-color: rgba(240, 145, 153, .35); }
.pw img { width: 100%; height: 100%; object-fit: cover; }
.ph {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 26px; color: #3c3c48; background: linear-gradient(160deg, #1d1d26, #14141b);
}
.rate, .ep, .bili, .trailer-mark {
  position: absolute; font-size: 11.5px; font-weight: 600; line-height: 1;
  padding: 5px 7px; border-radius: 6px; backdrop-filter: blur(4px);
}
.rate { top: 8px; left: 8px; color: var(--star); background: rgba(8, 8, 12, .74); }
.ep { bottom: 8px; right: 8px; color: #e6e6ee; background: rgba(8, 8, 12, .74); }
.bili { bottom: 8px; left: 8px; color: #fff; background: rgba(251, 114, 153, .92); }
.trailer-mark { top: 8px; right: 8px; color: #fff; background: rgba(8, 8, 12, .74); }
.t {
  margin: 9px 0 3px; font-size: 13.5px; font-weight: 560; line-height: 1.42;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.sub2 { font-size: 12px; color: var(--dim); display: flex; gap: 8px; }

/* ---------- 番剧表（星期筛选） ---------- */
.wdbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 18px; }
.wd-tab {
  padding: 7px 15px; border-radius: 999px; font-size: 13.5px; cursor: pointer;
  background: var(--card2); color: var(--dim); border: 1px solid transparent;
  transition: color .18s, background .18s, border-color .18s;
}
.wd-tab:hover { color: var(--fg); }
.wd-tab.on { background: rgba(240, 145, 153, .16); color: var(--accent); border-color: var(--accent-dim); font-weight: 600; }

/* ---------- 媒体库类型切换 ---------- */
.tabs { display: flex; gap: 8px; margin: 0 0 18px; }

/* ---------- 弹窗 ---------- */
.mask {
  position: fixed; inset: 0; z-index: 90; background: rgba(4, 4, 7, .82);
  backdrop-filter: blur(6px); display: none; align-items: flex-start; justify-content: center;
  overflow-y: auto; padding: 4vh 20px;
}
.mask.on { display: flex; }
.modal {
  width: min(920px, 100%); background: var(--card); border-radius: 16px; overflow: hidden;
  box-shadow: var(--shadow); border: 1px solid var(--line);
}
.mtop { display: flex; gap: 18px; padding: 24px 26px; }
.mp { width: 150px; flex: 0 0 150px; aspect-ratio: 2 / 3; border-radius: var(--r-sm); overflow: hidden; background: var(--card2); }
.mp img { width: 100%; height: 100%; object-fit: cover; }
.mb { flex: 1; min-width: 0; }
.mb h3 { margin: 2px 0 10px; font-size: 22px; line-height: 1.3; }
.meta { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 12px; }
.pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--card2); color: var(--dim); }
.plot { font-size: 13.8px; line-height: 1.8; color: #c2c2cc; margin: 0 0 16px; max-height: 168px; overflow-y: auto; }
.acts { display: flex; gap: 9px; flex-wrap: wrap; }
.btn {
  font-size: 13px; padding: 9px 15px; border-radius: var(--r-sm); cursor: pointer;
  background: var(--card2); color: var(--fg); border: 1px solid var(--line);
  transition: background .18s, border-color .18s;
}
.btn:hover { background: #2c2c38; border-color: var(--accent-dim); }
.btn.pri { background: var(--accent); color: #17171d; border-color: transparent; font-weight: 600; }
.x { position: absolute; top: 14px; right: 18px; font-size: 24px; color: var(--dim); cursor: pointer; line-height: 1; }
.x:hover { color: var(--fg); }

/* ---------- 内嵌播放 ---------- */
.trailer { position: relative; aspect-ratio: 16 / 9; background: #000; border-top: 1px solid var(--line); }
.trailer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.nt { padding: 10px 26px 18px; font-size: 12.5px; color: var(--dim); }

/* ---------- 状态 ---------- */
.empty, .loading { padding: 60px 0; text-align: center; color: var(--dim); font-size: 14px; }
.sk {
  border-radius: var(--r); aspect-ratio: 2 / 3;
  background: linear-gradient(100deg, #16161d 30%, #1e1e28 50%, #16161d 70%);
  background-size: 220% 100%; animation: sk 1.4s infinite linear;
}
@keyframes sk { to { background-position: -220% 0; } }

/* ---------- 移动端 ---------- */
@media (max-width: 760px) {
  .tw { padding: 0 16px; gap: 12px; }
  .searchbox input { width: 130px; }
  .searchbox input:focus { width: 160px; }
  .cnt { display: none; }
  main { padding: calc(var(--header-h) + 12px) 16px 60px; }
  .hero { min-height: 320px; }
  .hero-info { padding: 24px 20px; }
  .hero h1 { font-size: 26px; }
  .hero p { display: none; }
  .row { grid-auto-columns: 132px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 12px; }
  .mtop { flex-direction: column; padding: 18px; }
  .mp { width: 110px; flex-basis: 110px; }
}

/* ---------- 关联作品 ---------- */
.relbox { margin: 0 0 16px; }
.relhead { font-size: 12px; color: var(--dim); letter-spacing: 1px; margin-bottom: 8px; }
.relchip {
  display: inline-flex; align-items: center; gap: 6px; margin: 0 8px 8px 0;
  padding: 6px 12px; border-radius: 999px; font-size: 12.5px;
  background: var(--card2); color: var(--fg); border: 1px solid var(--line);
  transition: border-color .18s, color .18s;
}
.relchip:hover { border-color: var(--accent-dim); color: var(--accent); }
.relchip em { font-style: normal; font-size: 11px; color: var(--dim); }

/* ---------- 大图轮换 ---------- */
.hero { cursor: grab; touch-action: pan-y; }
.hero.grab { cursor: grabbing; }
.hero .slide {
  position: absolute; inset: 0; opacity: 0; transition: opacity .55s ease;
  pointer-events: none; display: flex; align-items: flex-end;
}
.hero .slide.on { opacity: 1; pointer-events: auto; position: relative; }
.hero .slide .hero-bg { position: absolute; inset: 0; z-index: -2; }
.hero .slide .hero-info { position: relative; z-index: 1; }
.hero { position: relative; }
.hero .dots {
  position: absolute; left: 44px; bottom: 22px; z-index: 3; display: flex; gap: 8px;
}
.hero .dots i {
  width: 22px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.28);
  cursor: pointer; transition: background .2s, width .2s;
}
.hero .dots i.on { background: var(--accent); width: 34px; }

/* ---------- 追番星标 ---------- */
.card .fav {
  position: absolute; top: 6px; right: 6px; z-index: 4; width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center; border-radius: 50%;
  font-size: 15px; color: #d8d8e2; background: rgba(8,8,12,.66);
  opacity: 0; transition: opacity .18s, color .18s, transform .12s;
}
.card:hover .fav, .card .fav.on { opacity: 1; }
.card .fav:hover { transform: scale(1.12); }
.card .fav.on { color: var(--star); }

/* ---------- 追番同步工具条 ---------- */
.syncbar { margin-left: auto; display: flex; gap: 10px; }
.syncbar a {
  font-size: 12px; color: var(--dim); cursor: pointer; padding: 4px 9px;
  border-radius: 999px; border: 1px solid var(--line); transition: color .18s, border-color .18s;
}
.syncbar a:hover { color: var(--accent); border-color: var(--accent-dim); }

/* ---------- 看板娘 ---------- */
#mascot {
  position: fixed; right: 22px; bottom: 18px; z-index: 80;
  width: 108px; pointer-events: none;
}
#mascot .fish {
  pointer-events: auto; cursor: pointer; width: 108px; height: 126px;
  filter: drop-shadow(0 10px 22px rgba(0,0,0,.55));
  animation: bob 3.4s ease-in-out infinite;
}
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
#mascot .bubble {
  position: absolute; right: 4px; bottom: 118px; max-width: 220px;
  background: rgba(24,24,32,.95); color: var(--fg); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 13px; font-size: 12.5px; line-height: 1.6;
  opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s;
  pointer-events: none; box-shadow: var(--shadow);
}
#mascot .bubble.on { opacity: 1; transform: translateY(0); }
@media (max-width: 760px) {
  #mascot { width: 74px; right: 10px; bottom: 10px; }
  #mascot .fish { width: 74px; height: 88px; }
  #mascot .bubble { bottom: 84px; max-width: 160px; font-size: 11.5px; }
  .hero .dots { left: 20px; bottom: 14px; }
}

/* 看板娘改成位图素材后，保持同尺寸与悬浮动效 */
#mascot .fish img { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>

<script>/* 共用交互：首页与媒体库页都加载这一份（由 _headers 长缓存） */
(function () {
  'use strict';
  var DATA = window.DATA || {};
  var $ = function (s) { return document.querySelector(s); };

  /* 区域：/cdn-cgi/trace 在 Pages 上不给 loc，只能用客户端信号。
     时区优先（VPN 下比语言准），语言兜底。 */
  var REGION_CN = (function () {
    try {
      var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
      if (/^Asia\/(Shanghai|Chongqing|Urumqi|Harbin)$/.test(tz)) return true;
      if (tz) return false;
      return /^zh(-|$)/i.test(navigator.language || '');
    } catch (e) { return false; }
  })();

  /* ---------- 追番（本地 + GitHub Gist 可选同步） ---------- */
  var FOLLOW_KEY = 'bgm_follow_v1', GIST_KEY = 'bgm_gist_cfg';
  function follows() {
    try { return JSON.parse(localStorage.getItem(FOLLOW_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveFollows(list) {
    localStorage.setItem(FOLLOW_KEY, JSON.stringify(list));
    document.dispatchEvent(new CustomEvent('follow-change'));
  }
  function fkey(it) { return String(it.key || it.id || it.name); }
  function isFollowed(k) { return follows().indexOf(k) >= 0; }
  function toggleFollow(k) {
    var list = follows(), i = list.indexOf(k);
    if (i >= 0) list.splice(i, 1); else list.push(k);
    saveFollows(list);
    return i < 0;
  }
  function gistCfg() {
    try { return JSON.parse(localStorage.getItem(GIST_KEY) || '{}'); } catch (e) { return {}; }
  }
  function pushGist() {
    var cfg = gistCfg();
    if (!cfg.token) { alert('先在「追番同步」里填 GitHub Token（只存在本机浏览器）'); return; }
    var body = {
      description: '番组计划 · 我的追番',
      public: true,
      files: { 'bgm-follow.json': { content: JSON.stringify({ updated: new Date().toISOString(), list: follows() }, null, 1) } }
    };
    var url = cfg.gistId ? 'https://api.github.com/gists/' + cfg.gistId : 'https://api.github.com/gists';
    fetch(url, {
      method: cfg.gistId ? 'PATCH' : 'POST',
      headers: { 'Authorization': 'token ' + cfg.token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.id) { cfg.gistId = d.id; localStorage.setItem(GIST_KEY, JSON.stringify(cfg)); alert('已同步到 Gist：' + d.html_url); }
      else alert('同步失败：' + (d.message || '未知错误'));
    }).catch(function (e) { alert('同步失败：' + e.message); });
  }
  function pullGist() {
    var cfg = gistCfg();
    if (!cfg.token || !cfg.gistId) { alert('先填 Token 并推送一次，才能拉取'); return; }
    fetch('https://api.github.com/gists/' + cfg.gistId, { headers: { 'Authorization': 'token ' + cfg.token } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var f = (d.files || {})['bgm-follow.json'];
        if (!f) return alert('Gist 里没有 bgm-follow.json');
        var data = JSON.parse(f.content || '{}');
        saveFollows((data.list || []).map(String));
        alert('已从 Gist 恢复 ' + (data.list || []).length + ' 条追番');
        location.reload();
      }).catch(function (e) { alert('拉取失败：' + e.message); });
  }
  function exportFollows() {
    var blob = new Blob([JSON.stringify({ list: follows() }, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'bgm-follow.json'; a.click();
  }
  function importFollows() {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var d = JSON.parse(rd.result);
          saveFollows(((d.list || d || [])).map(String));
          alert('已导入 ' + follows().length + ' 条'); location.reload();
        } catch (e) { alert('文件格式不对'); }
      };
      rd.readAsText(f);
    };
    inp.click();
  }


  var FMT = { TV: 'TV', TV_SHORT: '短片', ONA: '网络放送', OVA: 'OVA', MOVIE: '剧场版',
              SPECIAL: '特别篇', MUSIC: '音乐' };
  var ST = { RELEASING: '连载中', FINISHED: '已完结', NOT_YET_RELEASED: '未播出', CANCELLED: '已取消' };

  function countdown(ts) {
    var d = ts * 1000 - Date.now();
    if (d <= 0) return '待更新';
    var h = Math.floor(d / 3600000);
    if (h >= 24) return Math.floor(h / 24) + ' 天后更新';
    if (h >= 1) return h + ' 小时后更新';
    return Math.max(1, Math.floor(d / 60000)) + ' 分钟后更新';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function imgHTML(it, cls) {
    if (!it.poster) return '<div class="' + (cls || 'ph') + '">🎬</div>';
    var fb = it.pf ? ' data-fb="' + esc(it.pf) + '" onerror="__fb(this)"' : '';
    return '<img class="' + (cls || '') + '" src="' + esc(it.poster) + '"' + fb
      + ' loading="lazy" decoding="async" alt="">';
  }

  /* 海报三级回退：jsDelivr → gh-proxy → 同源 Pages（顺序写在 data-fb 里，用 | 分隔） */
  window.__fb = function (img) {
    var q = (img.dataset.fb || '').split('|').filter(Boolean);
    if (!q.length) { img.onerror = null; return; }
    img.src = q.shift();
    img.dataset.fb = q.join('|');
  };

  function bvidOf(it) {
    if (it.id && DATA.bili && DATA.bili[it.id]) return DATA.bili[it.id];
    if (it.key && DATA.bili_fresh && DATA.bili_fresh[it.key]) return DATA.bili_fresh[it.key];
    return '';
  }

  function cardHTML(it) {
    var bv = bvidOf(it);
    var html = '<div class="card" data-key="' + esc(it.key || it.id || it.name) + '">';
    html += '<div class="pw">' + imgHTML(it)
      + (it.rating ? '<span class="rate">★ ' + it.rating.toFixed(1) + '</span>' : '')
      + (it.episodes ? '<span class="ep">' + it.episodes + ' 集</span>' : '')
      + (bv ? '<span class="bili">B站</span>' : '')
      + (it.trailer ? '<span class="trailer-mark">预告</span>' : '')
      + (it.st === 'RELEASING' ? '<span class="ep" style="left:8px;right:auto;bottom:auto;top:8px;background:rgba(240,145,153,.92);color:#181820">连载</span>' : '')
      + '</div>';
    var k = fkey(it), fv = isFollowed(k);
    html += '<span class="fav' + (fv ? ' on' : '') + '" data-fav="' + esc(k) + '" title="追番">'
      + (fv ? '★' : '☆') + '</span>';
    html += '<div class="t">' + esc(it.name) + '</div>';
    var sub = [];
    if (it.st === 'RELEASING' && it.next_at) sub.push(countdown(it.next_at));
    else if (it.type === 'S' && it.wd && it.wd !== '-') sub.push(it.wd);
    if (it.year) sub.push(it.year);
    if (it.air) sub.push(it.air.slice(5));
    html += '<div class="sub2">' + sub.filter(Boolean).map(esc).join(' · ') + '</div>';
    return html + '</div>';
  }

  function bindCards(root) {
    root.querySelectorAll('.card').forEach(function (el) {
      el.onclick = function (ev) {
        var fv = ev.target.closest ? ev.target.closest('.fav') : null;
        if (fv) {
          ev.stopPropagation();
          var on = toggleFollow(fv.dataset.fav);
          fv.classList.toggle('on', on);
          fv.textContent = on ? '★' : '☆';
          if (PAGE === 'home' && location.hash !== 'skip') renderHome();
          return;
        }
        var k = el.dataset.key;
        var it = ALL.find(function (x) { return String(x.key || x.id || x.name) === k; });
        if (it) openModal(it);
      };
    });
  }

  function fill(el, items, chunk) {
    if (!el) return;
    el.innerHTML = '';
    ALL = ALL.concat(items);
    var i = 0;
    (function step() {
      var end = Math.min(i + (chunk || 40), items.length);
      var html = '';
      for (; i < end; i++) html += cardHTML(items[i]);
      el.insertAdjacentHTML('beforeend', html);
      bindCards(el);
      if (i < items.length) requestAnimationFrame(step);
    })();
  }

  /* ---------- 弹窗 ---------- */
  function openModal(it) {
    var isFresh = it.kind === 'fresh';
    var bv = bvidOf(it);
    var h = '<span class="x" onclick="closeM()">×</span><div class="mtop">'
      + '<div class="mp">' + imgHTML(it, '') + '</div><div class="mb">';
    h += '<h3>' + esc(it.name) + '</h3><div class="meta">';
    if (it.rating) h += '<span class="pill" style="color:var(--star)">★ ' + it.rating.toFixed(1) + '</span>';
    if (it.year) h += '<span class="pill">' + esc(it.year) + '</span>';
    if (it.episodes) h += '<span class="pill">' + it.episodes + ' 集</span>';
    if (it.wd && it.wd !== '-') h += '<span class="pill">' + esc(it.wd) + '</span>';
    if (it.air) h += '<span class="pill">' + esc(it.air) + '</span>';
    if (it.st) h += '<span class="pill" style="color:var(--accent)">' + esc(ST[it.st] || it.st) + '</span>';
    if (it.fm) h += '<span class="pill">' + esc(FMT[it.fm] || it.fm) + '</span>';
    if (it.du) h += '<span class="pill">' + it.du + ' 分钟</span>';
    if (it.studio) h += '<span class="pill">' + esc(it.studio) + '</span>';
    if (it.st === 'RELEASING' && it.next_at) h += '<span class="pill" style="color:var(--star)">' + countdown(it.next_at) + '</span>';
    (it.genres || []).slice(0, 4).forEach(function (g) { h += '<span class="pill">' + esc(g) + '</span>'; });
    h += '</div>';
    if (it.overview) h += '<p class="plot">' + esc(it.overview) + '</p>';
    if ((it.rel || []).length) {
      h += '<div class="relbox"><div class="relhead">关联作品</div>';
      (it.rel || []).forEach(function (r) {
        if (!r || !r.n) return;
        h += '<a class="relchip" target="_blank" rel="noopener" href="' + esc(r.u || '#') + '">'
          + esc(r.n) + (r.f ? '<em>' + esc(FMT[r.f] || r.f) + '</em>' : '') + '</a>';
      });
      h += '</div>';
    }
    h += '<div class="acts">';
    var cn = REGION_CN;
    if (bv) {
      h += '<span class="btn' + (cn ? ' pri' : '') + '" onclick="playBili(&#39;' + esc(bv) + '&#39;,' + (cn ? 'true' : 'false') + ')">▶ B站播放</span>';
    }
    if (it.trailer) {
      h += '<span class="btn' + (bv && cn ? '' : ' pri') + '" onclick="playTrailer(&#39;' + esc(it.trailer) + '&#39;)">▶ 预告</span>';
    }
    h += '<span class="pill" style="align-self:center;color:var(--dim)">' + (cn ? '国内线路 · 优先 B 站' : '海外线路 · 优先预告') + '</span>';
    if (!isFresh && it.id) h += '<a class="btn" target="_blank" rel="noopener" href="' + esc((window.JF || 'http://127.0.0.1:8100')) + '/web/#/details?id=' + esc(it.id) + '">Jellyfin</a>';
    if (it.url) h += '<a class="btn" target="_blank" rel="noopener" href="' + esc(it.url) + '">来源页</a>';
    if (it.name) h += '<a class="btn" target="_blank" rel="noopener" href="https://search.bilibili.com/all?keyword=' + encodeURIComponent(it.name) + '">B站搜索</a>';
    h += '</div></div></div><div class="trailer" id="trailer"></div>';
    $('#modal').innerHTML = h;
    $('#mask').classList.add('on');
    document.body.style.overflow = 'hidden';
    if (REGION_CN && bv) playBili(bv, true);
    else if (it.trailer) playTrailer(it.trailer);
  }

  function playTrailer(vid) {
    $('#trailer').innerHTML = '<iframe src="https://www.youtube.com/embed/' + encodeURIComponent(vid)
      + '?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
  }

  function playBili(bvid, auto) {
    $('#trailer').innerHTML = '<iframe src="//player.bilibili.com/player.html?bvid=' + encodeURIComponent(bvid)
      + '&page=1&high_quality=1&danmaku=0&autoplay=' + (auto ? '1' : '0')
      + '" allowfullscreen scrolling="no" allow="autoplay; fullscreen"></iframe>';
  }

  function closeM() {
    $('#mask').classList.remove('on');
    $('#trailer').innerHTML = '';
    document.body.style.overflow = '';
  }

  /* ---------- 大图轮换（自动 + 拖拽/滑动 + 圆点） ---------- */
  var heroTimer = null, heroIdx = 0, heroN = 0;
  function showSlide(n) {
    if (!heroN) return;
    heroIdx = (n + heroN) % heroN;
    document.querySelectorAll('#hero .slide').forEach(function (el, i) {
      el.classList.toggle('on', i === heroIdx);
    });
    document.querySelectorAll('#hero .dots i').forEach(function (el, i) {
      el.classList.toggle('on', i === heroIdx);
    });
  }
  function initHero() {
    var hero = $('#hero');
    if (!hero) return;
    heroN = hero.querySelectorAll('.slide').length;
    if (heroN < 2) return;
    clearInterval(heroTimer);
    heroTimer = setInterval(function () { showSlide(heroIdx + 1); }, 6000);
    hero.querySelectorAll('.dots i').forEach(function (d) {
      d.onclick = function () { showSlide(+d.dataset.dot); restartHero(); };
    });
    var x0 = null;
    hero.addEventListener('pointerdown', function (e) { x0 = e.clientX; hero.classList.add('grab'); });
    hero.addEventListener('pointerup', function (e) {
      hero.classList.remove('grab');
      if (x0 === null) return;
      var dx = e.clientX - x0; x0 = null;
      if (Math.abs(dx) > 60) { showSlide(heroIdx + (dx < 0 ? 1 : -1)); restartHero(); }
    });
    hero.addEventListener('pointerleave', function () { x0 = null; hero.classList.remove('grab'); });
    hero.addEventListener('mouseenter', function () { clearInterval(heroTimer); });
    hero.addEventListener('mouseleave', function () { restartHero(); });
    hero.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    hero.addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 45) { showSlide(heroIdx + (dx < 0 ? 1 : -1)); restartHero(); }
    });
  }
  function restartHero() {
    clearInterval(heroTimer);
    if (heroN > 1) heroTimer = setInterval(function () { showSlide(heroIdx + 1); }, 6000);
  }

  /* ---------- 看板娘（自绘 SVG 胖鱼拟人，无第三方素材/无授权负担） ---------- */
  var MASCOT_TIPS = [
    '点卡片上的 ☆ 就能追番啦',
    '番剧表按放送日排的，默认是今天',
    '海外 IP 会优先给预告，国内直接 B 站',
    '拖一下上面的大图可以换',
    '详情页里有制作公司和关联作品',
    '看板娘是社区素材：Mermaid · OpenGameArt · CC-BY 3.0'
  ];
  function mountMascot() {
    if ($('#mascot')) return;
    var el = document.createElement('div');
    el.id = 'mascot';
    el.innerHTML = '<div class="bubble" id="mbubble"></div>'
      + '<div class="fish"><img src="assets/mascot.png" alt="看板娘"></div>';
    document.body.appendChild(el);
    var bubble = el.querySelector('#mbubble');
    var timer = null;
    function tip() {
      bubble.textContent = MASCOT_TIPS[Math.floor(Math.random() * MASCOT_TIPS.length)];
      bubble.classList.add('on');
      clearTimeout(timer);
      timer = setTimeout(function () { bubble.classList.remove('on'); }, 4200);
    }
    el.querySelector('.fish').onclick = tip;
    setTimeout(tip, 2500);
  }

  /* ---------- 首页 ---------- */
  function renderHome() {
    var fa = (DATA.fresh && DATA.fresh.anime) || [];
    var fm = (DATA.fresh && DATA.fresh.movies) || [];
    /* 大图轮换：取有 banner 的前 6 部，自动 6s 切换 + 鼠标拖拽 / 触摸滑动 */
    var slides = fa.filter(function (x) { return x.banner; }).slice(0, 6);
    var out = '';
    if (slides.length) {
      out += '<section class="hero" id="hero">';
      slides.forEach(function (it, i) {
        out += '<div class="slide' + (i === 0 ? ' on' : '') + '" data-i="' + i + '">'
          + '<div class="hero-bg" style="background-image:url(\'' + esc(it.banner || it.poster || '') + '\')"></div>'
          + '<div class="hero-info"><div class="hero-tag">本季新番 · ' + esc((DATA.fresh.season || '').split(' ')[0] || '') + '</div>'
          + '<h1>' + esc(it.name) + '</h1><div class="hero-meta">';
        if (it.rating) out += '<span><b>★ ' + it.rating.toFixed(1) + '</b></span>';
        if (it.episodes) out += '<span>' + it.episodes + ' 集</span>';
        if (it.fm) out += '<span>' + esc(FMT[it.fm] || it.fm) + '</span>';
        if (it.st === 'RELEASING' && it.next_at) out += '<span>' + countdown(it.next_at) + '</span>';
        out += '</div><p>' + esc((it.overview || '').slice(0, 180)) + '</p><div class="hero-btns">';
        if (it.trailer) out += '<span class="hbtn primary" onclick="playTrailer(\'' + esc(it.trailer) + '\')">▶ 播放预告</span>';
        out += '<span class="hbtn ghost" data-open="' + esc(fkey(it)) + '">详情</span>';
        out += '</div></div></div>';
      });
      out += '<div class="dots">' + slides.map(function (_, i) {
        return '<i class="' + (i === 0 ? ' on' : '') + '" data-dot="' + i + '"></i>';
      }).join('') + '</div></section>';
    }

    var fl = follows();
    if (fl.length) {
      out += '<section class="block" id="myfollow"><div class="bhead"><h2>我的追番</h2><span>' + fl.length + ' 部</span>'
        + '<span class="syncbar"><a data-act="push">同步 Gist</a><a data-act="pull">恢复</a>'
        + '<a data-act="export">导出</a><a data-act="import">导入</a></span></div>'
        + '<div class="row" id="r-follow"></div></section>';
    }

    out += '<section class="block" id="sched"><div class="bhead"><h2>番剧表</h2><span>按放送日筛选</span></div>'
      + '<div class="wdbar" id="wdbar"></div><div class="grid" id="g-sched"></div></section>';
    out += '<section class="block"><div class="bhead"><h2>本季新番</h2><span>' + fa.length + ' 部</span></div><div class="row" id="r-anime"></div></section>';
    out += '<section class="block"><div class="bhead"><h2>新片</h2><span>' + fm.length + ' 部</span></div><div class="row" id="r-movie"></div></section>';

    $('#main').innerHTML = out;
    ALL = [];
    initHero();
    /* 先画 hero + 番剧表；两条轨道用空闲时间补，避免首屏被 48 张远程海报堵住 */
    var later = window.requestIdleCallback || function (fn) { return setTimeout(fn, 60); };
    later(function () {
      fill($('#r-anime'), fa.slice(0, ROW_CAP), ROW_CAP);
      fill($('#r-movie'), fm.slice(0, ROW_CAP), ROW_CAP);
    });
    if (follows().length) {
      var pool = fa.concat(fm);
      fill($('#r-follow'), pool.filter(function (x) { return isFollowed(fkey(x)); }), 24);
    }
    document.querySelectorAll('[data-open]').forEach(function (el) {
      el.onclick = function () {
        var it = ALL.find(function (x) { return fkey(x) === el.dataset.open; });
        if (it) openModal(it);
      };
    });
    document.querySelectorAll('.syncbar a').forEach(function (a) {
      a.onclick = function () {
        var act = a.dataset.act;
        if (act === 'push') pushGist();
        else if (act === 'pull') pullGist();
        else if (act === 'export') exportFollows();
        else importFollows();
      };
    });

    var days = ['全部'].concat(DAYS.slice(1), DAYS.slice(0, 1));
    var bar = $('#wdbar');
    days.forEach(function (d) {
      var n = d === '全部' ? fa.length : fa.filter(function (x) { return x.wd === d; }).length;
      var el = document.createElement('span');
      el.className = 'wd-tab' + ((d === '全部' && !WDFILTER) || d === WDFILTER ? ' on' : '');
      el.textContent = d + ' ' + n;
      el.onclick = function () { WDFILTER = d === '全部' ? '' : d; renderSched(fa); syncWd(); };
      bar.appendChild(el);
    });
    renderSched(fa);
    setCnt(fa.length + fm.length);
  }

  function syncWd() {
    document.querySelectorAll('#wdbar .wd-tab').forEach(function (el) {
      var label = el.textContent.split(' ')[0];
      el.classList.toggle('on', WDFILTER ? label === WDFILTER : label === '全部');
    });
  }

  function renderSched(fa) {
    var list = WDFILTER ? fa.filter(function (x) { return x.wd === WDFILTER; }) : fa;
    var g = $('#g-sched');
    g.innerHTML = '';
    ALL = ALL.filter(function (x) { return x.kind !== 'fresh' || x.type !== 'S' || !x._sched; });
    list.forEach(function (x) { x._sched = true; });
    fill(g, list, 30);
    if (!list.length) g.innerHTML = '<div class="empty">这一天没有放送</div>';
  }

  /* ---------- 媒体库 ---------- */
  function renderLibrary() {
    var lib = DATA.lib || [];
    var series = lib.filter(function (x) { return x.type === 'S'; });
    var movies = lib.filter(function (x) { return x.type !== 'S'; });
    var out = '<section class="block"><div class="bhead"><h2>我的媒体库</h2><span>番剧 ' + series.length + ' · 电影 ' + movies.length + '</span></div>'
      + '<div class="tabs" id="typebar"></div><div class="grid" id="g"></div></section>';
    $('#main').innerHTML = out;
    ALL = [];
    setCnt(lib.length);
    renderType('all', lib);
  }

  function renderType(kind, lib) {
    lib = lib || (DATA.lib || []);
    var list = kind === 'S' ? lib.filter(function (x) { return x.type === 'S'; })
      : kind === 'M' ? lib.filter(function (x) { return x.type !== 'S'; }) : lib;
    var bar = $('#typebar');
    if (bar && !bar.dataset.built) {
      bar.dataset.built = '1';
      [['all', '全部'], ['S', '番剧'], ['M', '电影']].forEach(function (p) {
        var el = document.createElement('span');
        el.className = 'wd-tab' + (p[0] === kind ? ' on' : '');
        el.textContent = p[1];
        el.onclick = function () {
          bar.querySelectorAll('.wd-tab').forEach(function (x) { x.classList.remove('on'); });
          el.classList.add('on');
          ALL = [];
          renderType(p[0], lib);
        };
        bar.appendChild(el);
      });
    }
    fill($('#g'), list, 60);
    if (!list.length) $('#g').innerHTML = '<div class="empty">没有内容</div>';
  }

  /* ---------- 搜索 ---------- */
  function bindSearch() {
    var q = $('#q');
    if (!q) return;
    q.oninput = function () {
      var kw = q.value.trim().toLowerCase();
      if (!kw) { PAGE === 'home' ? renderHome() : renderLibrary(); return; }
      var pool = PAGE === 'home'
        ? [].concat((DATA.fresh && DATA.fresh.anime) || [], (DATA.fresh && DATA.fresh.movies) || [])
        : (DATA.lib || []);
      var hits = pool.filter(function (x) { return (x.name || '').toLowerCase().indexOf(kw) >= 0; });
      ALL = [];
      var host = PAGE === 'home' ? $('#g-sched') : $('#g');
      if (!host) return;
      host.innerHTML = '';
      fill(host, hits, 60);
      if (!hits.length) host.innerHTML = '<div class="empty">没有匹配</div>';
      setCnt(hits.length);
    };
  }

  function setCnt(n) {
    var el = $('#cnt');
    if (el) el.textContent = n + ' 部';
  }

  /* ---------- 启动 ---------- */
  window.openModal = openModal;
  window.closeM = closeM;
  window.playTrailer = playTrailer;
  window.playBili = playBili;

  document.addEventListener('DOMContentLoaded', function () {
    window.JF = window.JF || 'http://127.0.0.1:8100';
    $('#mask').onclick = function (e) { if (e.target.id === 'mask') closeM(); };
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeM(); });
    var top = $('#topbar');
    window.addEventListener('scroll', function () {
      top.classList.toggle('solid', window.scrollY > 12);
    }, { passive: true });
    bindSearch();
    if (PAGE === 'home') renderHome(); else renderLibrary();
    mountMascot();
  });
})();
</script>
</body>
</html>
