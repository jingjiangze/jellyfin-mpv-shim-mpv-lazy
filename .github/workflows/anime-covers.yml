name: anime-covers

# Bangumi 封面 → ModelScope 数据集（站点海报主源）。
# 8 个 job 并行下载，collect job 统一提交到数据集仓库（并发 push 同一个 LFS 仓库会冲突，所以必须收口）。
# 定时统一由 .github/workflows/pipeline.yml 触发（保留 dispatch 供手工重跑）
on:
  workflow_dispatch:
    inputs:
      cover_size:
        description: "封面尺寸：c=中图~8.7KB（日常），l=大图~77.7KB（高清全量刷新一次）"
        required: false
        default: "c"
      dest:
        description: "推送到数据集的目录（posters 或 posters-c）"
        required: false
        default: "posters"

permissions:
  contents: read

concurrency:
  group: anime-covers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download covers
        working-directory: site-src
        env:
          SHARD_TOTAL: "64"
          COVER_WORKERS: "8"
          COVER_SIZE: ${{ github.event.inputs.cover_size || 'c' }}
          # schedule 触发时 inputs 为空，必须带默认值兜底
          COVER_OUT: site/${{ github.event.inputs.dest || 'posters' }}
        run: |
          set -euo pipefail
          P=${{ matrix.part }}
          export SHARD_LIST="$((P*8)),$((P*8+1)),$((P*8+2)),$((P*8+3)),$((P*8+4)),$((P*8+5)),$((P*8+6)),$((P*8+7))"
          echo "shard list = $SHARD_LIST"
          python -u fetch_bgm_covers.py

      - name: Upload covers
        uses: actions/upload-artifact@v4
        with:
          name: covers-${{ matrix.part }}
          # dest=posters-c（低清档）时图在 site-src/site/posters-c/，这里不能写死
          path: site-src/site/${{ github.event.inputs.dest || 'posters' }}/bgm-*.jpg
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: covers-*
          path: covers
          merge-multiple: true

      - name: Report
        run: |
          ls covers | wc -l | xargs echo "本次封面数:"
          du -sh covers || true

      - name: Push to ModelScope dataset
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          # schedule 触发时 inputs 为空，兜底 posters
          DEST: ${{ github.event.inputs.dest || 'posters' }}
        run: |
          set -euo pipefail
          if [ -z "${MS_TOKEN:-}" ]; then echo "no MODELSCOPE_TOKEN, skip"; exit 0; fi
          MS_URL="https://oauth2:${MS_TOKEN}@www.modelscope.cn/datasets/jingjiangze/Anime-JPG.git"
          rm -rf ms
          GIT_LFS_SKIP_SMUDGE=1 git clone -q "$MS_URL" ms
          cd ms
          echo "branch: $(git rev-parse --abbrev-ref HEAD)"
          mkdir -p "$DEST"
          added=0; skipped=0; updated=0
          for f in ../covers/*.jpg; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            want=$(stat -c%s "$f")
            if [ -e "$DEST/$b" ]; then
              # LFS 指针里带 "size N"；真实文件读不到 size 就按一致处理。
              # 只升不降：新图更大（c→l 高清刷新）才覆盖，避免日常 c 轮把 l 打回去。
              have=$(grep -o 'size [0-9]\+' "$DEST/$b" 2>/dev/null | awk '{print $2}' | head -1 || true)
              if [ -n "${have:-}" ] && [ "$have" -lt "$want" ]; then
                cp -f "$f" "$DEST/$b"; updated=$((updated+1))
              else
                skipped=$((skipped+1))
              fi
              continue
            fi
            cp -f "$f" "$DEST/$b"; added=$((added+1))
          done
          echo "dest=$DEST added=$added updated=$updated skipped=$skipped"
          if [ $((added+updated)) -eq 0 ]; then echo "no new covers"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$DEST"
          git commit -q -m "covers: +$added ~$updated"
          # 有未暂存改动时不 stash 会让 pull --rebase 直接中断（上一轮就死在这）
          git stash -u -q || true
          for i in 1 2 3; do
            git fetch -q origin HEAD || true
            git -c rebase.autoStash=true rebase FETCH_HEAD || git rebase --abort || true
            echo "== push attempt $i =="
            if git push origin HEAD:master; then echo "PUSHED"; exit 0; fi
            sleep 6
          done
          echo "::error::push to ModelScope failed"; exit 1
