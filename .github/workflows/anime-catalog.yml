name: anime-catalog

# 全量索引：从 bangumi-data 拿「所有动画 + 它们的 bgm.tv id」，写 site-src/data/catalog.json。
# 为什么不直接查 Bangumi 搜索接口：空关键词 total 被硬截断在 1000，date/air_date 过滤实测失效。
on:
  schedule:
    - cron: "20 17 * * *"   # 每天 01:20（北京时间）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog from bangumi-data
        working-directory: site-src
        run: python -u fetch_catalog.py

      - name: Commit catalog (Git Data API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CNT=$(python -c 'import json;print(json.load(open("site-src/data/catalog.json"))["count"])')
          python -u site-src/push_tree.py --message "catalog: ${CNT} anime subjects [skip ci]" site-src/data/catalog.json
