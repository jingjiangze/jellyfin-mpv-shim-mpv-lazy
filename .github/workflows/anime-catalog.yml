name: anime-catalog

# 全量索引：从 bangumi-data 拿「所有动画 + 它们的 bgm.tv id」，写 site-src/data/catalog.json。
# 为什么不直接查 Bangumi 搜索接口：空关键词 total 被硬截断在 1000，date/air_date 过滤实测失效。
on:
  schedule:
    - cron: "20 17 * * *"   # 每天 01:20（北京时间）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog from bangumi-data
        working-directory: site-src
        run: python -u fetch_catalog.py

      - name: Commit catalog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-src/data/catalog.json
          if git diff --cached --quiet; then echo "catalog unchanged"; exit 0; fi
          git commit -m "catalog: $(python -c "import json;print(json.load(open('site-src/data/catalog.json'))['count'])") anime subjects [skip ci]"
          git fetch origin "${GITHUB_REF_NAME}"
          git -c rebase.autoStash=true rebase FETCH_HEAD || { echo "rebase conflict, skip push"; git rebase --abort || true; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed (non-fatal)"
