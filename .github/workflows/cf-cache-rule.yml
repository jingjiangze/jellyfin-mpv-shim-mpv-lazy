name: cf-cache-rule

# 给 anime.jiangjiangze.icu 加一条 Cache Rule「Cache Everything」。
#
# 为什么：Cloudflare Pages 对 HTML 一律不回边缘缓存（cf-cache-status 恒为
# DYNAMIC），_headers 里的 s-maxage 被忽略。实测这条线路回源 TTFB 1–12s，
# 而同域名的 /magnet-eps.js 因为命中边缘缓存，1.5s 能拉 900KB。只有
# Cache Rule 能强制 HTML 也走边缘。
#
# 用法：workflow_dispatch 选 action
#   show   —— 只打印当前 http_request_cache_settings 规则（不改任何东西）
#   apply  —— 追加本规则（幂等：已存在就跳过）
#   remove —— 按 description 删掉本规则
# 回滚：action=remove 重跑即可。

on:
  workflow_dispatch:
    inputs:
      action:
        description: "show=只读查看 / apply=加规则 / remove=删规则"
        required: true
        default: "show"
        type: choice
        options: ["show", "apply", "remove"]

permissions:
  contents: read

jobs:
  rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read current ruleset
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          H="authorization: Bearer $CF_TOKEN"
          ZID=$(curl -s -H "$H" "$API/zones?name=jiangjiangze.icu" \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["result"][0]["id"] if d.get("result") else "")')
          if [ -z "$ZID" ]; then echo "::error::拿不到 zone id（token 缺 Zone:Read？）"; exit 1; fi
          echo "ZONE_ID=$ZID" >> "$GITHUB_ENV"
          CODE=$(curl -s -o ruleset.json -w '%{http_code}' -H "$H" \
                 "$API/zones/$ZID/rulesets/phases/http_request_cache_settings/entrypoint")
          echo "GET ruleset -> $CODE"
          if [ "$CODE" != "200" ]; then echo '{"result":{"rules":[]}}' > ruleset.json; fi

      - name: Build rules
        run: python3 site-src/cf_cache_rule.py "${{ inputs.action }}" ruleset.json put.json

      - name: Apply rules
        if: ${{ inputs.action != 'show' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          OUT=$(curl -s -X PUT -H "authorization: Bearer $CF_TOKEN" \
                -H "content-type: application/json" --data @put.json \
                -w '\n%{http_code}' \
                "$API/zones/$ZONE_ID/rulesets/phases/http_request_cache_settings/entrypoint")
          BODY=$(printf '%s' "$OUT" | head -n -1)
          CODE=$(printf '%s' "$OUT" | tail -n1)
          echo "PUT -> $CODE"
          printf '%s' "$BODY" | head -c 1200; echo
          if [ "$CODE" != "200" ]; then
            echo "::error::写入失败 —— token 需要 Zone → Cache Rules → Edit 权限"
            exit 1
          fi
