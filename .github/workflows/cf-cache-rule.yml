name: cf-cache-rule

# 管理 anime.jiangjiangze.icu 的 Cache Rule（Cache Everything）。
#
# 为什么：Cloudflare Pages 对 HTML 一律不回边缘缓存（cf-cache-status 恒为
# DYNAMIC），_headers 里的 s-maxage 被忽略。实测这条线路回源 TTFB 1–12s，
# 而同域名的 /magnet-eps.js 命中边缘缓存则 1.5s 能拉 900KB。
#
# action：
#   show   只打印现有 http_request_cache_settings 规则（只读）
#   apply  幂等追加规则（已存在则跳过）
#   remove 按 description 删除本规则（回滚）
#   diag   打印 token 能访问哪些端点（排查 403）
#
# 注意：token 需要 Zone → Cache Rules → Edit 才能改；否则 entrypoint 返回 403。

on:
  workflow_dispatch:
    inputs:
      action:
        description: "show / apply / remove / diag"
        required: true
        default: "show"
        type: choice
        options: ["show", "apply", "remove", "diag"]

permissions:
  contents: read

jobs:
  rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read current ruleset
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          H="authorization: Bearer $CF_TOKEN"
          ZONE_JSON=$(curl -s -H "$H" "$API/zones?name=jiangjiangze.icu")
          ZID=$(printf '%s' "$ZONE_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["result"][0]["id"] if d.get("result") else "")')
          if [ -z "$ZID" ]; then echo "::error::拿不到 zone id（token 缺 Zone:Read？）"; exit 1; fi
          ACC=$(printf '%s' "$ZONE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"][0]["account"]["id"])')
          echo "ZONE_ID=$ZID" >> "$GITHUB_ENV"
          echo "ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
          echo "zone=$ZID account=$ACC"
          CODE=$(curl -s -o ruleset.json -w '%{http_code}' -H "$H" "$API/zones/$ZID/rulesets/phases/http_request_cache_settings/entrypoint")
          echo "GET ruleset -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo '{"result":{"rules":[]}}' > ruleset.json
          fi

      - name: Diagnose token
        if: ${{ inputs.action == 'diag' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          H="authorization: Bearer $CF_TOKEN"
          echo "== token verify =="
          curl -s -H "$H" "$API/user/tokens/verify" | head -c 400; echo
          echo "== endpoints =="
          curl -s -o /dev/null -w "zones_list=%{http_code}\n" -H "$H" "$API/zones?per_page=5"
          curl -s -o /dev/null -w "rulesets_list=%{http_code}\n" -H "$H" "$API/zones/$ZONE_ID/rulesets"
          curl -s -o /dev/null -w "cache_entrypoint=%{http_code}\n" -H "$H" "$API/zones/$ZONE_ID/rulesets/phases/http_request_cache_settings/entrypoint"
          curl -s -o /dev/null -w "pages_project=%{http_code}\n" -H "$H" "$API/accounts/$ACCOUNT_ID/pages/projects/media-library"

      - name: Build rules
        if: ${{ inputs.action == 'show' || inputs.action == 'apply' || inputs.action == 'remove' }}
        run: python3 site-src/cf_cache_rule.py "${{ inputs.action }}" ruleset.json put.json

      - name: Apply rules
        if: ${{ inputs.action == 'apply' || inputs.action == 'remove' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          CODE=$(curl -s -o put_out.json -w '%{http_code}' -X PUT \
            -H "authorization: Bearer $CF_TOKEN" \
            -H "content-type: application/json" \
            --data @put.json \
            "$API/zones/$ZONE_ID/rulesets/phases/http_request_cache_settings/entrypoint")
          echo "PUT -> $CODE"
          head -c 1200 put_out.json; echo
          if [ "$CODE" != "200" ]; then
            echo "::error::写入失败 —— token 需要 Zone → Cache Rules → Edit"
            exit 1
          fi
