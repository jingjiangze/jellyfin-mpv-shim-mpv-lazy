name: site-sync

# 刮削 + 构建 + 部署全在 GitHub 上跑。数据源已实测可达（AniList/TMDB/豆瓣/B站）。
# 每个抓取步骤单独设超时 + 单轮上限：卡住会失败而不是无声挂几小时，多跑几轮自然收敛。
# 触发方式：由 pipeline.yml 每 4 小时触发；也可手动 dispatch。

# 定时统一由 .github/workflows/pipeline.yml 触发（保留 dispatch 供手工重跑）
# 触发方式（2026-11-08 审计后）：
#   · push 到 main 且只动了前端（tpl/**、build_site.py、推送脚本）→ **fast 模式**：
#     跳过全部抓取步骤，只走「Restore state → 构建 → 同步资产 → 部署」，约 5 分钟。
#     在此之前前端改动必须手动 dispatch、跑满 25 分钟全套抓取，是这条链路最大的手工口子。
#   · pipeline.yml 每 4 小时触发 / 手动 dispatch → 全量。
on:
  workflow_dispatch:
    inputs:
      fast:
        description: "只构建+部署（跳过全部抓取步骤）"
        type: boolean
        default: false
  # 由 pipeline.yml 作为可复用 workflow 调用（不再靠轮询 gh api 发现 run id）
  workflow_call:
    inputs:
      fast:
        description: "只构建+部署（跳过全部抓取步骤）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site-src/tpl/**"
      - "site-src/build_site.py"
      - "site-src/publish_all.py"
      - "site-src/sync_posters_ms.py"
      - "site-src/ms-revert-blocklist.txt"
      - ".github/workflows/site-sync.yml"

permissions:
  contents: write
  issues: write          # 失败时开/更新 ci-alert issue（见末尾 Notify 步骤）

# 分两组：push（fast）自成一队、后来的直接抢占 —— 前端连推几次不该排队等 5 分钟；
# 全量 run（pipeline / dispatch）单独一队且不抢占 —— 抢占等于白扔一次 25 分钟的抓取。
concurrency:
  group: site-sync-${{ github.event_name == 'push' && 'fast' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # FAST=1 时跳过全部抓取步骤，只构建 + 部署（push 触发，或 dispatch 时勾 fast）
      FAST: ${{ (github.event_name == 'push' || inputs.fast) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        run: |
          set -euo pipefail
          mkdir -p site-src/site
          cp site-src/data/*.json site-src/site/ 2>/dev/null || true
          cp site-src/data/poster_cache.json site-src/ 2>/dev/null || true
          cp site-src/data/data.json site-src/data/bili.json site-src/site/ 2>/dev/null || true
          cp site-src/data/years_state.json site-src/site/ 2>/dev/null || true
          ls -la site-src/site | head -6

      - name: Fetch fresh anime and movies
        if: ${{ env.FAST != '1' && success() }}
        timeout-minutes: 12
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python -u fetch_fresh_v2.py

      - name: Fetch bilibili links
        if: ${{ env.FAST != '1' && success() }}
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          BILI_MAX: "350"
        run: python -u fetch_bili.py

      - name: Fetch bilibili links for fresh items
        if: ${{ env.FAST != '1' && success() }}
        timeout-minutes: 30
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          FRESH_BILI_MAX: "300"
        run: python -u fetch_bili_fresh.py

      - name: Fetch magnet links
        if: ${{ env.FAST != '1' && success() }}
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          MAGNET_MAX: "150"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAN_HUB_USER: ${{ secrets.PAN_HUB_USER }}
          PAN_HUB_PASS: ${{ secrets.PAN_HUB_PASS }}
        run: python -u fetch_magnet.py

      - name: Fill rating distributions
        if: ${{ env.FAST != '1' && success() }}
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          RATE_MAX: "2000"
          RATE_WORKERS: "4"
        run: python -u fetch_ratings.py

      # 角色 / 制作人员 / 收藏统计（Bangumi v0），每轮补 PEOPLE_MAX 条
      - name: Fill characters and staff
        if: ${{ env.FAST != '1' && success() }}
        timeout-minutes: 35
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          # 2026-11-04 上调：角色 46,510 条 / 制作人 53,318 条里只有 2,099 处是
          # 镜像裸名（覆盖率 4.5%），按 1,500/轮 × 4h 要跑十几天。制作人本轮
          # 才开始抓头像（st 加第三个字段），所以三者一起加大。
          PEOPLE_MAX: "3000"
          PEOPLE_WORKERS: "3"
          # 头像镜像：实测 runner 到 lain.bgm.tv 很快（2,683 张 / 65 秒），
          # 源不可达时脚本 6 秒预检即跳过。
          # 2026-11-03 第二轮实测 8s/0 重试在全挂（dl=0 fail=10），放宽到 20s/1 次重试。
          AVATAR_MAX: "3000"
          AVATAR_WORKERS: "6"
          AVATAR_TIMEOUT: "20"
          AVATAR_RETRIES: "1"
        run: python -u fetch_people.py

      - name: Fill missing posters
        if: ${{ env.FAST != '1' && success() }}
        timeout-minutes: 20
        working-directory: site-src
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          NO_LOCAL_PROXY: "1"
          POSTER_MAX: "150"
        run: python -u fill_posters.py

      # 新番封面落地：AniList 是海外源（单张 28–157KB、TTFB 0.57–4.80s 抖动），
      # 落到 site/posters/ 后由下面的 Sync posters to ModelScope 自动上云，
      # build_site 再把主源换成 ModelScope（国内 0.35s）。
      - name: Fetch fresh covers
        if: ${{ env.FAST != '1' && success() }}
        timeout-minutes: 20
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          COVER_MAX: "150"
        run: python -u fetch_covers.py

      # 豆瓣封面有防盗链（无 referer 418 / 站点 referer 403），必须构建期带
      # movie.douban.com 的 referer 下到本地，再由数据集分发。
      - name: Fetch Douban covers
        if: ${{ env.FAST != '1' && success() }}
        timeout-minutes: 12
        continue-on-error: true
        working-directory: site-src
        run: python -u fetch_douban_covers.py

      # TMDB 热门/正在上映：给「电影」页第二、三块供数。
      # 接口失败不阻断站点（脚本自身 exit 0 并保留上一轮 tmdb.json）。
      - name: Fetch TMDB movies
        if: ${{ env.FAST != '1' && success() }}
        timeout-minutes: 10
        continue-on-error: true
        working-directory: site-src
        env:
          POSTER_DIR: ../media/posters
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python -u fetch_tmdb.py

      # 豆瓣剧情简介：电影页点开卡片要显示简介。
      # 豆瓣有 IP 级风控（subject_ip_rate_limit），失败时脚本保留上一轮数据，
      # 所以这里 continue-on-error 不会把已抓到的简介冲掉。
      # 「哪里能看」快照（TMDB / JustWatch）：每部电影 1 次请求，默认 80 部上限。
      # 条款要求：必须署名 JustWatch，缓存不超过 6 个月（我们每轮刷新），且 TMDB 不给深链。
      - name: Fetch TMDB watch providers
        # fast 也跑：只有 80 次请求（~30s），但缺了它电影页就没有「哪里能看」
        if: ${{ success() }}
        timeout-minutes: 8
        continue-on-error: true
        working-directory: site-src
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python -u fetch_wp.py --max 80

      - name: Fetch Douban intros
        if: ${{ env.FAST != '1' && success() }}
        timeout-minutes: 15
        continue-on-error: true
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        working-directory: site-src
        run: python -u fetch_douban_intro.py

      # 日文简介自动翻译：公共谷歌 gtx 接口（无需 key），只翻 overview 为日文的条目，
      # 已有 overview_ja 的跳过（幂等）。翻完写回 site/anime/*.json + site/data/s*.json，
      # 失败不阻断构建。
      - name: Translate Japanese overviews
        if: ${{ env.FAST != '1' && success() }}
        # 2026-11-04 由 60 降到 10：这一步反复吃满 60 分钟超时，把整条发布队列堵死
        # （实测两次 run 各卡 1.5 小时，站点修复无法上线）。翻译是幂等的，翻不完下次继续。
        timeout-minutes: 10
        continue-on-error: true
        working-directory: site-src
        env:
          # 2026-11-04 由 8 降到 4：并发 8 实测约 1,624 条后 gtx 连片限流
          # （run 41678297541 失败 1,671 条）。脚本侧另加了失败直方图 + 熔断。
          TR_WORKERS: "4"
        run: python -u translate_overviews.py

      # 分片/状态用 Git Data API 直推：publish 那步的 git rebase 会被同轮的
      # 两次 API 推送撞成冲突（实测 "rebase conflict, skip push" 丢掉整轮数据）。
      # 必须排在 Translate 之后：Translate 写的是 site/anime/*.json（真源），
      # 只有这条 Git Data API 路径能可靠落盘；后面的 Publish data + posters + state
      # 有 rebase 冲突静默跳过的分支，实测丢过整轮 1,624 条翻译（run 41678297541）。
      # 官方频道正片索引（两份都从盒子取；CI runner 直连 YouTube 是 404，盒子有 mihomo 隧道）：
      #   yt.json       4 小时 RSS：每频道最新 15 条，追新
      #   yt-full.json  每日 yt-dlp 枚举 uploads 播放列表：每频道 100 条，与历史并集 → 整季回填
      # 写临时文件、校验通过才 mv：盒子抖动时保留上一版（历史上直接 rm 掉把 YouTube 源打没）。
      - name: Fetch official YouTube episodes
        # fast 也要拉：yt-full.json 不入库（4.5MB 且每天变），构建必须有它
        if: ${{ success() }}
        timeout-minutes: 4
        continue-on-error: true
        working-directory: site-src
        run: |
          set -uo pipefail
          pull() {
            TMP="$RUNNER_TEMP/$1"
            rm -f "$TMP"
            if ! curl -sfk -m 40 "https://120.48.56.189/ytdata/$1" -o "$TMP"; then
              echo "::warning::$1 拉取失败，保留上一版"
              return 0
            fi
            if python - "$TMP" "$1" <<'PYEOF'
          import json, sys
          d = json.loads(open(sys.argv[1], encoding="utf-8").read())
          vids = d.get("videos")
          assert isinstance(vids, list) and vids, "videos 缺失或为空"
          bad = [v for v in vids[:50] if not str((v or {}).get("v") or "")]
          assert not bad, "前 50 条里有缺 videoId 的"
          print("  %s: %d 条" % (sys.argv[2], len(vids)))
          PYEOF
            then mv -f "$TMP" "site/$1"
            else echo "::warning::$1 内容不合法，保留上一版"
            fi
          }
          pull yt.json
          pull yt-full.json

      - name: Build pages
        id: build
        timeout-minutes: 6
        working-directory: site-src
        env:
          # 海报以仓库 media/posters 为准（CI 工作区里没有 site/posters）
          POSTER_DIR: ../media/posters
        run: python -u build_site.py


      # 构建产物立刻快照：后面的 git 提交/rebase 都碰不到部署内容。
      # （之前没有快照，一次失败的 pull --rebase 把工作树回滚成旧提交，
      #   部署直接把上一轮的 HTML 发了出去——已实测踩过。）
      - name: Snapshot build output
        run: |
          set -euo pipefail
          rm -rf build-out && mkdir -p build-out/data
          # 磁力页已删（2026-11-03）：magnet.html 不再产出，别再 cp 它，否则整步失败、部署被跳过
          # 必需页缺失要报错；可选页（如 fav.html）存在才拷 —— 构建脚本暂未产出时不会把整步打挂
          for pg in index anime movie rank user search detail; do
            [ -f "site-src/site/$pg.html" ] || { echo "::error::缺少必需页面 $pg.html"; exit 1; }
            cp "site-src/site/$pg.html" build-out/
          done
          for pg in fav; do
            [ -f "site-src/site/$pg.html" ] && cp "site-src/site/$pg.html" build-out/
          done
          # HTML 现在是骨架，样式与脚本拆成独立文件（由 build_site 写出）
          cp -f site-src/site/style.css site-src/site/app.js build-out/
          cp -f site-src/site/app-*.js site-src/site/style-*.css build-out/ 2>/dev/null || true

          cp site-src/tpl/_headers build-out/_headers
          # 媒体库已下线：旧链接 301 回首页（否则 CF Pages 会回落成 200 + 首页 HTML）
          cp -f site-src/tpl/_redirects build-out/_redirects 2>/dev/null || true
          # 逐个 glob 拷贝，不用 `cp -r 目录 目录`（目标已存在时会多套一层）
          cp -f site-src/site/data/*.json build-out/data/
          cp -f site-src/tpl/magnet-eps.js build-out/ || true
          cp -f site-src/site/magnet-eps.json build-out/ || true
          cp -r site-src/site/assets build-out/assets 2>/dev/null || true
          N=$(ls -1 build-out/data/*.json | wc -l)
          echo "data files: $N"
          du -sh build-out
          # 分片少于 60 个说明构建没产出，直接失败而不是悄悄发个坏版
          if [ "$N" -lt 60 ]; then echo "::error::data files only $N, expected >=60"; exit 1; fi

      # 新增/变更的海报自动同步到 ModelScope 数据集（站点海报主源）。
      # 历史教训：这步曾在 6a4cae6 加过，7 分钟后被 a0434128（CRLF 归一化那次）连带冲掉，
      # 之后所有运行都不再有它 —— 数据集从此停更。这里保留并加固：
      #   ① 按「文件大小」比对而不是只看存在，同名但内容变了也会重传；
      #   ② 不再用 `2>&1 | sed` 包住 git push（管道会吞掉退出码，失败也被判成功）；
      #   ③ 跳过 ms-revert-blocklist.txt 里的文件（ModelScope 审核会撤销，重传无意义）。
      # 海报 / 资产镜像到 ModelScope 数据集（站点主 CDN 源）。
      # 2026-11-09 重写：原来是 ~90 行 bash，2.4 万张海报每条 fork 一个 grep，实测每轮 ~10 分钟；
      # 现在单进程 Python 一次读完尺寸表（1–2 秒），clone --depth 1 + 3 次重试，
      # 推送冲突 rebase -X theirs → 仍冲突则 graft（把本轮树挂到上游最新提交）。
      # clone 三次失败只 warning 不判红：站点还有 gh-proxy / 同源两条兜底。
      - name: Sync posters to ModelScope
        id: ms
        timeout-minutes: 20
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: python -u site-src/sync_posters_ms.py

      # 发布：**单一写入者**。一次 run 只产生一个提交，覆盖站点需要的全部仓库路径
      # （media/assets 固定名+哈希名、media/data 全部 JSON、media/posters 增量、
      #   site-src/site/anime 清洗后的真源、site-src/site/*.json 与 site-src/data/* 状态）。
      # 重构前这里是 4 个各自写仓库的步骤（Push shards / Push data / Push style / git Publish），
      # 互相抢同一批文件，只能靠 rebase/graft 硬扛冲突；现在只剩这一处写。
      - name: Publish (single writer)
        timeout-minutes: 12
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u site-src/publish_all.py --yes

      - name: Deploy to Cloudflare Pages
        # 两条约束：
        #  · 镜像同步（ModelScope）失败不该挡住上线 —— 数据集只是兜底源，站点在 CF Pages；
        #  · 但**构建失败绝对不能部署**：build-out 不存在时 `cp` 直接报错退出（2026-11-09
        #    实测 name 'hashlib' 那次），更糟的情况是拿上一轮残留产物发上线。
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cp -r build-out dist
          ls -la dist | head -20
          # --branch 必须显式给 main：checkout 后是 detached HEAD，wrangler 会把部署
          # 当成预览版（alias=head）而不更新生产环境
          npx -y wrangler@4 pages deploy dist --project-name=media-library \
            --branch=main --commit-dirty=true

      # 失败告警：Actions 没人盯着，失败要能自己找上门。
      # 同一类失败只保留**一个**开着的 ci-alert issue（按标题前缀去重），后续失败追加评论。
      - name: Notify failure (ci-alert issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BODY="$RUNNER_TEMP/ci-alert.md"
          {
            echo "运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "- 模式：${{ github.event_name }}（FAST=${{ env.FAST }}）"
            echo "- 提交：${{ github.sha }}"
            echo
            echo "常见原因：抓取源超时 / ModelScope 数据集推送失败 / CF Pages token 失效 / 构建断言（data files < 60）失败。"
            echo "排查顺序：先看带 ::error:: 的那一步，再看 Build pages 与 Deploy 的日志。"
          } > "$BODY"
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-alert --state open --json number,title --jq '.[]|select(.title|startswith("CI 失败 · site-sync"))|.number' 2>/dev/null | head -1 || true)
          if [ -n "${NUM:-}" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$BODY" && echo "已追加到 issue #$NUM"
          else
            gh label create ci-alert --repo "$GITHUB_REPOSITORY" --color B60205 --description "CI 失败告警（自动创建）" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "CI 失败 · site-sync（$(date -u +%m-%d)）" --label ci-alert --body-file "$BODY" && echo "已开新告警 issue"
          fi
