name: site-sync

# 刮削 + 构建 + 部署全在 GitHub 上跑。数据源已实测可达（AniList/TMDB/豆瓣/B站）。
# 每个抓取步骤单独设超时 + 单轮上限：卡住会失败而不是无声挂几小时，多跑几轮自然收敛。

on:
  schedule:
    - cron: "10 */4 * * *"   # 每 4 小时一轮（北京时间 02:10/06:10/10:10/14:10/18:10/22:10）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        run: |
          set -euo pipefail
          mkdir -p site-src/site
          cp site-src/data/*.json site-src/site/ 2>/dev/null || true
          cp site-src/data/poster_cache.json site-src/ 2>/dev/null || true
          cp site-src/data/data.json site-src/data/bili.json site-src/site/ 2>/dev/null || true
          cp site-src/data/years_state.json site-src/site/ 2>/dev/null || true
          ls -la site-src/site | head -6

      - name: Fetch fresh anime and movies
        timeout-minutes: 12
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python -u fetch_fresh_v2.py

      - name: Fetch bilibili links
        timeout-minutes: 15
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          BILI_MAX: "150"
        run: python -u fetch_bili.py

      - name: Fetch bilibili links for fresh items
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          FRESH_BILI_MAX: "200"
        run: python -u fetch_bili_fresh.py

      - name: Fetch magnet links
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          MAGNET_MAX: "150"
          PAN_HUB_USER: ${{ secrets.PAN_HUB_USER }}
          PAN_HUB_PASS: ${{ secrets.PAN_HUB_PASS }}
        run: python -u fetch_magnet.py

      - name: Fill year catalogs (2000-now)
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          YEARS_PER_RUN: "9"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u fetch_years.py

      - name: Fill missing posters
        timeout-minutes: 20
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          POSTER_MAX: "150"
        run: python -u fill_posters.py

      - name: Build pages
        timeout-minutes: 6
        working-directory: site-src
        env:
          # 海报以仓库 media/posters 为准（CI 工作区里没有 site/posters）
          POSTER_DIR: ../media/posters
        run: python -u build_site.py

      # 构建产物立刻快照：后面的 git 提交/rebase 都碰不到部署内容。
      # （之前没有快照，一次失败的 pull --rebase 把工作树回滚成旧提交，
      #   部署直接把上一轮的 HTML 发了出去——已实测踩过。）
      - name: Snapshot build output
        run: |
          set -euo pipefail
          rm -rf build-out && mkdir -p build-out
          cp site-src/site/index.html site-src/site/library.html site-src/site/style.css site-src/site/app.js build-out/
          cp site-src/tpl/_headers build-out/_headers
          cp -r site-src/site/assets build-out/assets 2>/dev/null || true
          cp site-src/site/index-*.json site-src/site/library-*.json build-out/ 2>/dev/null || true
          cp -r site-src/site/years build-out/years 2>/dev/null || true
          cp -r media/posters build-out/posters 2>/dev/null || true
          ls -la build-out

      # 每轮只提交+推送一次：数据 JSON、海报、站点状态一起进仓库。
      # 必须排在 Build pages 之后 —— build_site 每轮用内容哈希生成新的
      # index-<hash>.json / library-<hash>.json，HTML 里外链的就是这些名字。
      # 走 git 协议而不是 Git Data API：CI 的 GITHUB_TOKEN 经常被
      # "API rate limit exceeded for installation" 卡死（实测整步挂满 18 分钟）。
      - name: Publish data + posters + state
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -euo pipefail
          cp -f site-src/site/index-*.json site-src/site/library-*.json media/
          if [ -d site-src/site/posters ]; then
            mkdir -p media/posters
            cp -f site-src/site/posters/*.jpg media/posters/ 2>/dev/null || true
          fi
          cp -f site-src/site/data.json site-src/site/bili.json site-src/site/magnet.json site-src/data/ || true
          cp -f site-src/poster_cache.json site-src/data/ || true
          cp -f site-src/site/years_state.json site-src/data/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media site-src/data site-src/site site-src/poster_cache.json
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "data: site payloads + state [skip ci]"
          # 提交之后工作树仍可能有未暂存改动（构建脚本会回写 site/ 下的副本，
          # 而它们不在上面的 git add 路径里）。直接 rebase 会报
          # "cannot rebase: You have unstaged changes" 然后走到 skip push，
          # 结果 HTML 里引用的 index-<hash>.json 根本没进 media/ —— 线上 404 的根因。
          # 用 autoStash 让 rebase 自己把改动收起来，成功后自动恢复。
          git fetch origin "${GITHUB_REF_NAME}"
          # 仓库里有文件是以 CRLF 存的（历史 API 推送留下的），检出后 git 会认为
          # 它们全都被改过，rebase 直接报 "You have unstaged changes" 然后跳过 push。
          # 此刻该提交的都已经 commit 了，直接丢弃这些纯换行差异最稳。
          git checkout -- . || true
          git status --short | head -20 || true
          git -c rebase.autoStash=true rebase FETCH_HEAD || {
            echo "rebase conflict, skip push"; git status --short | head -20 || true
            git rebase --abort || true; exit 0
          }
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed (non-fatal)"

      # 新海报增量同步到 ModelScope 数据集（海报主源）。没配 MODELSCOPE_TOKEN 自动跳过。
      - name: Sync new posters to ModelScope
        timeout-minutes: 10
        continue-on-error: true
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MS_TOKEN:-}" ]; then echo "no MODELSCOPE_TOKEN, skip"; exit 0; fi
          MS_URL="https://oauth2:${MS_TOKEN}@www.modelscope.cn/datasets/jingjiangze/Anime-JPG.git"
          rm -rf "$RUNNER_TEMP/ms" || true
          # 只拉元数据不拉 LFS 实体（已有海报都在远端，只有新增的要上传）
          GIT_LFS_SKIP_SMUDGE=1 git clone -q "$MS_URL" "$RUNNER_TEMP/ms" 2>&1 | sed -E 's#oauth2:[^@]*@#oauth2:***@#g'
          mkdir -p "$RUNNER_TEMP/ms/posters"
          added=0
          for f in site-src/site/posters/*.jpg media/posters/*.jpg; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            [ -e "$RUNNER_TEMP/ms/posters/$b" ] && continue
            cp -f "$f" "$RUNNER_TEMP/ms/posters/$b"
            added=$((added+1))
          done
          echo "new posters to sync: $added"
          [ "$added" -eq 0 ] && exit 0
          cd "$RUNNER_TEMP/ms"
          git add -A posters
          git -c commit.gpgsign=false -c user.name=github-actions               -c user.email=actions@users.noreply.github.com commit -qm "sync $added posters from CI"
          git push "$MS_URL" HEAD:master 2>&1 | sed -E 's#oauth2:[^@]*@#oauth2:***@#g'

      # 部署只认 build-out/ 快照
      - name: Deploy to Cloudflare Pages
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cp -r build-out dist
          ls -la dist
          # --branch 必须显式给 main：checkout 后是 detached HEAD，wrangler 会把部署
          # 当成预览版（alias=head）而不更新生产环境
          npx -y wrangler@4 pages deploy dist --project-name=media-library \
            --branch=main --commit-dirty=true
