name: site-sync

# 刮削 + 构建 + 部署全在 GitHub 上跑。数据源已实测可达（AniList/TMDB/豆瓣/B站）。
# 每个抓取步骤单独设超时 + 单轮上限：卡住会失败而不是无声挂几小时，多跑几轮自然收敛。

on:
  schedule:
    - cron: "10 */4 * * *"   # 每 4 小时一轮（北京时间 02:10/06:10/10:10/14:10/18:10/22:10）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        run: |
          set -euo pipefail
          mkdir -p site-src/site
          cp site-src/data/*.json site-src/site/ 2>/dev/null || true
          cp site-src/data/poster_cache.json site-src/ 2>/dev/null || true
          cp site-src/data/data.json site-src/data/bili.json site-src/site/ 2>/dev/null || true
          cp site-src/data/years_state.json site-src/site/ 2>/dev/null || true
          ls -la site-src/site | head -6

      - name: Fetch fresh anime and movies
        timeout-minutes: 12
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python -u fetch_fresh_v2.py

      - name: Fetch bilibili links
        timeout-minutes: 15
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          BILI_MAX: "150"
        run: python -u fetch_bili.py

      - name: Fetch bilibili links for fresh items
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          FRESH_BILI_MAX: "200"
        run: python -u fetch_bili_fresh.py

      - name: Fill year catalogs (2000-now)
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          YEARS_PER_RUN: "9"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u fetch_years.py

      - name: Fill missing posters
        timeout-minutes: 20
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          POSTER_MAX: "150"
        run: python -u fill_posters.py

      # 海报走 git 协议发布：CI 的 GITHUB_TOKEN 经常被
      # "API rate limit exceeded for installation" 卡死在 Git Data API 上（实测整整挂 18 分钟）
      - name: Push new posters to asset repo
        timeout-minutes: 12
        continue-on-error: true
        run: |
          set -euo pipefail
          [ -d site-src/site/posters ] || { echo "no new posters"; exit 0; }
          mkdir -p media/posters
          cp -f site-src/site/posters/*.jpg media/posters/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media/posters
          if git diff --cached --quiet; then echo "no poster change"; exit 0; fi
          git commit -m "assets: new posters [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; echo "rebase failed"; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "poster push failed (non-fatal)"

      - name: Build pages
        timeout-minutes: 6
        working-directory: site-src
        env:
          # 海报以仓库 media/posters 为准（CI 工作区里没有 site/posters）
          POSTER_DIR: ../media/posters
        run: python -u build_site.py

      # 必须排在 Build pages 之后：build_site 每轮用内容哈希生成新的
      # index-<hash>.json / library-<hash>.json，HTML 里外链的就是这些名字。
      # 发布走 git 协议（Git Data API 会被 installation 级限流打死）。
      - name: Publish data JSON to media/
        timeout-minutes: 6
        continue-on-error: true
        run: |
          set -euo pipefail
          cp -f site-src/site/index-*.json site-src/site/library-*.json media/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media/index-*.json media/library-*.json
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -m "data: site payloads [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; echo "rebase failed"; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "data push failed (non-fatal)"

      # Deploy 必须排在 Persist state 之前：Persist 里的 git pull --rebase 一旦冲突，
      # git 会把工作树重置回「构建前」的旧提交，部署就会发上一轮的 HTML（已实测发生过）。
      - name: Deploy to Cloudflare Pages
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp site-src/site/index.html site-src/site/library.html \
             site-src/site/style.css site-src/site/app.js dist/
          cp site-src/tpl/_headers dist/_headers
          cp -r site-src/site/assets dist/assets 2>/dev/null || true
          # 同源第三档兜底：数据 JSON 也放一份到自己域名下
          cp site-src/site/index-*.json site-src/site/library-*.json dist/ 2>/dev/null || true
          cp -r site-src/site/years dist/years 2>/dev/null || true
          ls -la dist
          # --branch 必须显式给 main：checkout 后是 detached HEAD，wrangler 会把部署
          # 当成预览版（alias=head）而不更新生产环境
          npx -y wrangler@4 pages deploy dist --project-name=media-library \
            --branch=main --commit-dirty=true

      - name: Persist state back to the repo
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -euo pipefail
          cp -f site-src/site/data.json site-src/site/bili.json site-src/data/ || true
          cp -f site-src/poster_cache.json site-src/data/ || true
          cp -f site-src/site/years_state.json site-src/data/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site-src/data site-src/site site-src/poster_cache.json || true
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "chore: sync site state [skip ci]"
            # 并发/排队时远端可能已前进；rebase 失败就放弃本轮回写（部署已经完成）
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "state push failed (non-fatal)"
          fi
