name: site-sync

# 刮削 + 构建 + 部署全在 GitHub 上跑。数据源已实测可达（AniList/TMDB/豆瓣/B站）。
# 每个抓取步骤单独设超时 + 单轮上限：卡住会失败而不是无声挂几小时，多跑几轮自然收敛。
# 触发方式：由 pipeline.yml 每 4 小时触发；也可手动 dispatch。

# 定时统一由 .github/workflows/pipeline.yml 触发（保留 dispatch 供手工重跑）
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        run: |
          set -euo pipefail
          mkdir -p site-src/site
          cp site-src/data/*.json site-src/site/ 2>/dev/null || true
          cp site-src/data/poster_cache.json site-src/ 2>/dev/null || true
          cp site-src/data/data.json site-src/data/bili.json site-src/site/ 2>/dev/null || true
          cp site-src/data/years_state.json site-src/site/ 2>/dev/null || true
          ls -la site-src/site | head -6

      - name: Fetch fresh anime and movies
        timeout-minutes: 12
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python -u fetch_fresh_v2.py

      - name: Fetch bilibili links
        timeout-minutes: 15
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          BILI_MAX: "150"
        run: python -u fetch_bili.py

      - name: Fetch bilibili links for fresh items
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          FRESH_BILI_MAX: "200"
        run: python -u fetch_bili_fresh.py

      - name: Fetch magnet links
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          MAGNET_MAX: "150"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAN_HUB_USER: ${{ secrets.PAN_HUB_USER }}
          PAN_HUB_PASS: ${{ secrets.PAN_HUB_PASS }}
        run: python -u fetch_magnet.py

      - name: Fill year catalogs (2000-now)
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          YEARS_PER_RUN: "9"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u fetch_years.py

      # 评分分布：Bangumi 旧接口的 rating.count（v0 没有分布字段）。
      # 只在 CI 跑 —— 本机/盒子到 api.bgm.tv 一律 000，runner 直连 0.16s。
      # 每轮补 RATE_MAX 条，已有 rc 的跳过，多轮收敛。
      - name: Fill rating distributions
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          RATE_MAX: "2000"
          RATE_WORKERS: "4"
        run: python -u fetch_ratings.py

      # 角色 / 制作人员 / 收藏统计（Bangumi v0），每轮补 PEOPLE_MAX 条
      - name: Fill characters and staff
        timeout-minutes: 25
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          PEOPLE_MAX: "1500"
          PEOPLE_WORKERS: "3"
        run: python -u fetch_people.py

      # 分片/状态用 Git Data API 直推：publish 那步的 git rebase 会被同轮的
      # 两次 API 推送撞成冲突（实测 "rebase conflict, skip push" 丢掉整轮数据）。
      - name: Push shards (Git Data API)
        timeout-minutes: 10
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u site-src/push_shards.py

      - name: Fill missing posters
        timeout-minutes: 20
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          POSTER_MAX: "150"
        run: python -u fill_posters.py

      # 新番封面落地：AniList 是海外源（单张 28–157KB、TTFB 0.57–4.80s 抖动），
      # 落到 site/posters/ 后由下面的 Sync posters to ModelScope 自动上云，
      # build_site 再把主源换成 ModelScope（国内 0.35s）。
      - name: Fetch fresh covers
        timeout-minutes: 20
        continue-on-error: true
        working-directory: site-src
        env:
          NO_LOCAL_PROXY: "1"
          COVER_MAX: "150"
        run: python -u fetch_covers.py

      # 豆瓣封面有防盗链（无 referer 418 / 站点 referer 403），必须构建期带
      # movie.douban.com 的 referer 下到本地，再由数据集分发。
      - name: Fetch Douban covers
        timeout-minutes: 12
        continue-on-error: true
        working-directory: site-src
        run: python -u fetch_douban_covers.py

      # TMDB 热门/正在上映：给「电影」页第二、三块供数。
      # 接口失败不阻断站点（脚本自身 exit 0 并保留上一轮 tmdb.json）。
      - name: Fetch TMDB movies
        timeout-minutes: 10
        continue-on-error: true
        working-directory: site-src
        env:
          POSTER_DIR: ../media/posters
        run: python -u fetch_tmdb.py

      # 豆瓣剧情简介：电影页点开卡片要显示简介。
      # 豆瓣有 IP 级风控（subject_ip_rate_limit），失败时脚本保留上一轮数据，
      # 所以这里 continue-on-error 不会把已抓到的简介冲掉。
      - name: Fetch Douban intros
        timeout-minutes: 15
        continue-on-error: true
        working-directory: site-src
        run: python -u fetch_douban_intro.py

      - name: Build pages
        timeout-minutes: 6
        working-directory: site-src
        env:
          # 海报以仓库 media/posters 为准（CI 工作区里没有 site/posters）
          POSTER_DIR: ../media/posters
        run: python -u build_site.py


      # 构建产物立刻快照：后面的 git 提交/rebase 都碰不到部署内容。
      # （之前没有快照，一次失败的 pull --rebase 把工作树回滚成旧提交，
      #   部署直接把上一轮的 HTML 发了出去——已实测踩过。）
      - name: Snapshot build output
        run: |
          set -euo pipefail
          rm -rf build-out && mkdir -p build-out/data
          cp site-src/site/index.html site-src/site/anime.html site-src/site/movie.html site-src/site/rank.html site-src/site/magnet.html build-out/
          # HTML 现在是骨架，样式与脚本拆成独立文件（由 build_site 写出）
          cp -f site-src/site/style.css site-src/site/app.js build-out/

          cp site-src/tpl/_headers build-out/_headers
          # 媒体库已下线：旧链接 301 回首页（否则 CF Pages 会回落成 200 + 首页 HTML）
          cp -f site-src/tpl/_redirects build-out/_redirects 2>/dev/null || true
          # 逐个 glob 拷贝，不用 `cp -r 目录 目录`（目标已存在时会多套一层）
          cp -f site-src/site/data/*.json build-out/data/
          cp -f site-src/tpl/magnet-eps.js build-out/ || true
          cp -f site-src/site/magnet-eps.json build-out/ || true
          cp -r site-src/site/assets build-out/assets 2>/dev/null || true
          N=$(ls -1 build-out/data/*.json | wc -l)
          echo "data files: $N"
          du -sh build-out
          # 分片少于 60 个说明构建没产出，直接失败而不是悄悄发个坏版
          if [ "$N" -lt 60 ]; then echo "::error::data files only $N, expected >=60"; exit 1; fi

      # 新增/变更的海报自动同步到 ModelScope 数据集（站点海报主源）。
      # 历史教训：这步曾在 6a4cae6 加过，7 分钟后被 a0434128（CRLF 归一化那次）连带冲掉，
      # 之后所有运行都不再有它 —— 数据集从此停更。这里保留并加固：
      #   ① 按「文件大小」比对而不是只看存在，同名但内容变了也会重传；
      #   ② 不再用 `2>&1 | sed` 包住 git push（管道会吞掉退出码，失败也被判成功）；
      #   ③ 跳过 ms-revert-blocklist.txt 里的文件（ModelScope 审核会撤销，重传无意义）。
      - name: Sync posters to ModelScope
        id: ms
        timeout-minutes: 12
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MS_TOKEN:-}" ]; then echo "::error::MODELSCOPE_TOKEN 未配置 —— 数据集是主源，缺它不允许继续部署"; exit 1; fi
          MS_URL="https://oauth2:${MS_TOKEN}@www.modelscope.cn/datasets/jingjiangze/Anime-JPG.git"
          BLOCK="site-src/ms-revert-blocklist.txt"
          rm -rf "$RUNNER_TEMP/ms"
          if ! GIT_LFS_SKIP_SMUDGE=1 git clone -q "$MS_URL" "$RUNNER_TEMP/ms" 2>"$RUNNER_TEMP/ms-clone.err"; then
            sed -E 's#oauth2:[^@]*@#oauth2:***@#g' "$RUNNER_TEMP/ms-clone.err"
            echo "::error::clone ModelScope dataset failed"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ms/posters"
          added=0; updated=0; skipped=0; blocked=0
          for f in site-src/site/posters/*.jpg media/posters/*.jpg; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            if [ -f "$BLOCK" ] && grep -qxF "$b" "$BLOCK"; then blocked=$((blocked+1)); continue; fi
            dst="$RUNNER_TEMP/ms/posters/$b"
            want=$(stat -c%s "$f")
            if [ -e "$dst" ]; then
              # SKIP_SMUDGE 检出的是 LFS 指针文本，里面有 "size N"；真实文件则读不到，按一致处理
              have=$(grep -o 'size [0-9]\+' "$dst" 2>/dev/null | awk '{print $2}' | head -1 || true)
              if [ -n "${have:-}" ] && [ "$have" != "$want" ]; then
                cp -f "$f" "$dst"; updated=$((updated+1))
              else
                skipped=$((skipped+1))
              fi
            else
              cp -f "$f" "$dst"; added=$((added+1))
            fi
          done
          echo "posters: added=$added updated=$updated unchanged=$skipped blocklisted=$blocked"
          # 交互脚本镜像进数据集 assets/：CF Pages 劣化时给 jsDelivr/gh-proxy 之外的国内第三源
          mkdir -p "$RUNNER_TEMP/ms/assets"
          mkdir -p "$RUNNER_TEMP/ms/assets/data"
          cp -f site-src/site/data/*.json "$RUNNER_TEMP/ms/assets/data/" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ms/assets"/app-*.js
          js_added=0
          for f in site-src/site/app-*.js; do
            [ -e "$f" ] || continue
            cp -f "$f" "$RUNNER_TEMP/ms/assets/"; js_added=$((js_added+1))
          done
          echo "js: copied=$js_added"
          # 站点静态资源（HTML 骨架引用的样式/脚本/加载器）与分集索引分片：
          # 一律以数据集为主源（国内 CDN，实测 0.2–0.5s），jsDelivr/同源只作兜底。
          asset_added=0
          for f in site-src/site/style.css site-src/site/app.js site-src/tpl/magnet-eps.js; do
            [ -e "$f" ] || continue
            cp -f "$f" "$RUNNER_TEMP/ms/assets/"; asset_added=$((asset_added+1))
          done
          # eps 分片由 anime-magnet 自己镜像进数据集（它 publish 完立刻推）。
          # 这里不能再拷：site-sync 的 checkout 通常比刚跑完的 magnet 旧，
          # 拷一次就把新版覆盖回旧版（实测数据集 count 4490 -> 被盖成 4279，
          # 纯合集条目 16 -> 0）。
          # 页面 HTML 也镜像一份：数据集是主存，GitHub 是次存（构建产物本身不进仓，
          # 只有 dist 里的这份镜像能让人从数据集完整取回一个可跑的站点）。
          mkdir -p "$RUNNER_TEMP/ms/assets/site"
          cp -f site-src/site/index.html site-src/site/anime.html site-src/site/movie.html site-src/site/rank.html site-src/site/magnet.html                 "$RUNNER_TEMP/ms/assets/site/" 2>/dev/null || true
          echo "html: $(ls -1 "$RUNNER_TEMP/ms/assets/site" 2>/dev/null | wc -l) 页"
          echo "site assets: copied=$asset_added eps=$(ls -1 "$RUNNER_TEMP/ms/assets/eps" 2>/dev/null | wc -l)"
          if [ -z "$(git -C "$RUNNER_TEMP/ms" status --porcelain -- posters assets)" ]; then
            echo "dataset already in sync"; exit 0
          fi
          cd "$RUNNER_TEMP/ms"
          git add -A posters assets
          git -c commit.gpgsign=false -c user.name=github-actions               -c user.email=actions@users.noreply.github.com commit -qm "sync posters + js from site repo (+$added ~$updated js=$js_added)"
          if ! git push "$MS_URL" HEAD:master 2>"$RUNNER_TEMP/ms-push.err"; then
            sed -E 's#oauth2:[^@]*@#oauth2:***@#g' "$RUNNER_TEMP/ms-push.err"
            echo "::error::push to ModelScope failed"; exit 1
          fi
          echo "pushed: +$added ~$updated posters"

      # GitHub 镜像：data JSON（含 64 个详情分片）+ css/js/loader，增量推送
      # （只推内容变化的 blob，否则每轮 8MB 会把仓库撑爆）。数据集仍是主源。
      # 必须排在 Sync posters to ModelScope 之后：它读的是本轮构建产物
      # site-src/site/{data,style.css,app.js,magnet-eps.js}，而 Restore state
      # + Build pages 才产出这些文件。push_data_cdn.py 用 cwd 的 site/ 读文件
      # （ROOT = Path.cwd()），所以这里必须给 working-directory: site-src。
      # 失败不阻断部署（continue-on-error），但要留下 warning 注解。
      - name: Push data JSON to GitHub CDN
        timeout-minutes: 10
        continue-on-error: true
        working-directory: site-src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u push_data_cdn.py --yes || { echo "::warning::GitHub CDN 镜像推送失败（非致命，数据集仍是主源）"; exit 1; }

      # style.css / app.js 推到 media/assets/，由 jsDelivr(gcore) 分发。
      # 不走 `git add -A media`：实测那条路 media/assets 进不了提交
      # （publish 步骤 success 但仓库里没有该目录），原因未查清；
      # 这里用 Git Data API 直推，与 magnet_publish.py 同一条可靠路径。
      - name: Push style/app to CDN
        timeout-minutes: 5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u site-src/push_site_assets.py

      # 每轮只提交+推送一次：数据 JSON、海报、站点状态一起进仓库。
      # 必须排在 Build pages 之后 —— build_site 每轮用内容哈希生成新的
      # index-<hash>.json / library-<hash>.json，HTML 里外链的就是这些名字。
      # 走 git 协议而不是 Git Data API：CI 的 GITHUB_TOKEN 经常被
      # "API rate limit exceeded for installation" 卡死（实测整步挂满 18 分钟）。
      - name: Publish data + posters + state
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -euo pipefail
          # index-*.json / library-*.json 已由上面的 `Push data JSON to CDN`
          # （push_assets.py --data-only，走 Git Data API）推到 media/；
          # 这里再 cp 一遍等于两边改同一批文件，是非快进冲突的来源，故删掉。
          if [ -d site-src/site/posters ]; then
            mkdir -p media/posters
            cp -f site-src/site/posters/*.jpg media/posters/ 2>/dev/null || true
          fi
          cp -f site-src/site/data.json site-src/site/bili.json site-src/site/magnet.json site-src/site/magnet-eps.json site-src/data/ || true
          cp -f site-src/poster_cache.json site-src/data/ || true
          cp -f site-src/site/years_state.json site-src/data/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media site-src/data site-src/site site-src/poster_cache.json
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "data: site payloads + state [skip ci]"
          # 仓库里部分文本文件是以 CRLF 提交的（历史 API 推送留下），检出后 git 的
          # 换行归一化会把它们算成「已修改」，rebase 于是报 "You have unstaged
          # changes" 并 skip push —— 线上 index-<hash>.json 一直 404 就是这么来的。
          # checkout / sed 都治不了（差异是索引侧算出来的），最稳的办法是
          # 把这些改动直接并进本次提交，让索引和工作树彻底一致。
          git add -u || true
          git commit --amend --no-edit -q || true
          git fetch origin "${GITHUB_REF_NAME}"
          git status --short | head -20 || true
          git -c rebase.autoStash=true rebase FETCH_HEAD || {
            echo "rebase conflict, skip push"; git status --short | head -20 || true
            git rebase --abort || true; exit 0
          }
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed (non-fatal)"

      # 部署只认 build-out/ 快照
      - name: Deploy to Cloudflare Pages
        if: steps.ms.outcome == 'success'
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cp -r build-out dist
          ls -la dist | head -20
          # --branch 必须显式给 main：checkout 后是 detached HEAD，wrangler 会把部署
          # 当成预览版（alias=head）而不更新生产环境
          npx -y wrangler@4 pages deploy dist --project-name=media-library \
            --branch=main --commit-dirty=true
