name: pipeline

# 单一调度入口。2026-11-09 重构：原来是 4 个步骤各自 `gh workflow run` 再**轮询 gh api**
# 发现新 run id 并等待（18×5s 找 id + 每 10s 一探），既慢又脆。现在改用 GitHub 原生
# **可复用 workflow**（jobs.<id>.uses）：调用方 job 会一直等到被调 workflow 结束，
# 结论直接进 needs —— 不会拿错上一轮的 run，也不需要轮询。
#
# 顺序（needs 构成 DAG）：catalog → detail → covers → site-sync
# 每步都 `if: always()`：detail 自 2026-11-01 起在 Report coverage 步失败过，
# 它的产物陈旧一点也能构建，绝不能因此断了后面的部署。
# site-sync 是部署终点 —— 只有它失败才让整个 pipeline 失败（见末尾 summary job）。

on:
  schedule:
    - cron: "5 */4 * * *"   # 每 4 小时的第 5 分钟
  workflow_dispatch:

# 可复用 workflow 只能「降级」调用方权限、不能升级：这里给足
permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  catalog:
    name: anime-catalog
    if: always()
    uses: ./.github/workflows/anime-catalog.yml
    secrets: inherit

  detail:
    name: anime-detail
    needs: [catalog]
    if: always()
    uses: ./.github/workflows/anime-detail.yml
    secrets: inherit

  covers:
    name: anime-covers
    needs: [detail]
    if: always()
    uses: ./.github/workflows/anime-covers.yml
    secrets: inherit

  sync:
    name: site-sync（部署终点）
    needs: [catalog, detail, covers]
    if: always()
    uses: ./.github/workflows/site-sync.yml
    secrets: inherit

  summary:
    name: summary
    needs: [catalog, detail, covers, sync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总 + 判定
        run: |
          {
            echo "## pipeline 结果"
            echo ""
            echo "| 阶段 | 结论 |"
            echo "|---|---|"
            echo "| anime-catalog | ${{ needs.catalog.result }} |"
            echo "| anime-detail | ${{ needs.detail.result }} |"
            echo "| anime-covers | ${{ needs.covers.result }} |"
            echo "| site-sync（部署） | ${{ needs.sync.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "catalog=${{ needs.catalog.result }} detail=${{ needs.detail.result }} covers=${{ needs.covers.result }} sync=${{ needs.sync.result }}"
          if [ "${{ needs.sync.result }}" != "success" ]; then
            echo "::error::site-sync 未成功（${{ needs.sync.result }}），部署链路失败"
            exit 1
          fi
